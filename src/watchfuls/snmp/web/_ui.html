// diffing here would mean fetching two whole files to throw most of them away.
async function _mibVersionDiff(uid, version, other, otherVersion) {
    const modName = _mibManagerModuleName;
    const cfg = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'diff_mib_versions'),
                              { ...cfg, name: _mibEditName, uid, other: other || '' });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    if (d.identical) {
        showToast(_ms('mib_version_same', 'No differences'));
        return;
    }
    if (_mibSrcEditor) {
        _mibEditToggle(false);
        _mibSrcEditor.setOption('mode', 'mibdiff');
        _mibSrcEditor.setValue(d.diff || '');
        _mibSrcEditor.refresh();
    }
    const bar = document.getElementById('mibEditBar');
    if (bar) {
        // Which way round it reads, spelled out: a diff whose direction you have to guess is
        // one you can read backwards without noticing.
        bar.innerHTML = `<span class="badge bg-secondary">${esc(d.a)} → ${esc(d.b)}</span>
            ${d.truncated ? `<span class="badge bg-warning text-dark">${esc(_ms('mib_version_diff_big', 'shown in part'))}</span>` : ''}
            <button class="btn btn-sm btn-secondary" onclick="_mibEditCancel()">
                <i class="bi bi-x me-1"></i>${esc(_ms('mib_version_back', 'Back to the current file'))}</button>
            ${_mibVersionsPickHtml(uid, version)}`;
    }
}

// The other side of the comparison. Defaults to the file on disk; the rest of the versions
// are here so "what changed between v2 and v3" does not need a second screen.
function _mibVersionsPickHtml(uid, version) {
    const others = _mibVersions.filter(v => v.uid !== uid);
    if (!others.length) return '';
    return `<select class="form-select form-select-sm" style="width:auto"
            onchange="_mibVersionDiff(${jsStr(uid)},${version},this.value)">
        <option value="">${esc(_ms('mib_version_vs_current', 'vs the current file'))}</option>
        ${(() => {
            const me = _mibVersions.find(x => x.uid === uid);
            const p = me && _mibParentUid(me);
            return p ? `<option value="${escAttr(p)}" selected>${esc(_ms('mib_version_vs_parent', 'vs its own base'))}</option>` : '';
        })()}
        ${others.map(v => `<option value="${escAttr(v.uid)}">${esc(_ms('mib_version_vs', 'vs'))} v${v.version}</option>`).join('')}
    </select>`;
}

// Deleting one version. The history is the reason anybody dares edit a vendor MIB, so it is
// not tidied automatically beyond the cap — but a version somebody knows is junk should not
// have to stay for ever either.
function _mibVersionDelete(uid, version, isOriginal) {
    // Version 1 is the only one that cannot be got back from anywhere: the file it came from
    // has been overwritten by every save since. Saying so is the difference between a warning
    // and a warning that means something.
    const msg = isOriginal
        ? _ms('mib_version_delete_original_confirm',
              'Delete v{n}? It is the only copy of this MIB as the vendor shipped it.')
        : _ms('mib_version_delete_confirm', 'Delete v{n} from the history?');
    showConfirmModal(msg.replace('{n}', version), () => _mibVersionDeleteConfirmed(uid));
}

async function _mibVersionDeleteConfirmed(uid) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'delete_mib_version'),
                              { ...(modulesData[modName] || {}), name: _mibEditName, uid });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    _mibVersions = d.versions || [];
    _mibVersionsDraw();
    _mibEditRenderBar();
    showToast(_ms('mib_version_deleted', 'Version deleted'));
    await _mibLoad();
}

function _mibVersionRestore(uid, version) {
    showConfirmModal(
        _ms('mib_version_restore_confirm', 'Restore v{n}? The current content is kept as a version.')
            .replace('{n}', version),
        () => _mibVersionRestoreConfirmed(uid));
}

async function _mibVersionRestoreConfirmed(uid) {
    const modName = _mibManagerModuleName;
    const cfg = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'restore_mib_version'),
                              { ...cfg, name: _mibEditName, uid });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    _mibVersions = d.versions || [];
    // The restored bytes are the file now; put them in the editor rather than reloading the
    // modal to find out what we just wrote.
    const back = await apiPost(_mibApiUrl(modName, 'get_mib_version'), { ...cfg, uid });
    const bd = back && back.data;
    if (bd && bd.ok && _mibSrcEditor) {
        _mibSrcOnDisk = bd.source || '';
        _mibSrcEditor.setValue(_mibSrcOnDisk);
        _mibSrcEditor.refresh();
    }
    showToast(_ms('mib_edit_saved', 'Saved — the MIB has to be compiled again'));
    _mibEditToggle(false);
    const box = document.getElementById('mibVersionsBox');
    if (box) box.style.display = 'none';
    await _mibDeclRefresh();
    await _mibLoad();
}

// ── MIB Browser modal — full OID tree ────────────────────────────
let _mibBrowserSymbols    = null;   // flat symbol list from get_all_symbols
let _mibBrowserTreeRoot   = null;   // prefix tree built from symbols
let _mibBrowserExpanded   = new Set();
let _mibBrowserFilter     = '';
let _mibBrowserSearchTimer = null;  // debounce handle

async function openMibBrowserModal(modName) {
    _mibManagerModuleName = modName;
    _mibBrowserSymbols    = null;
    _mibBrowserTreeRoot   = null;
    _mibBrowserExpanded   = new Set();
    _mibBrowserFilter     = '';

    const titleEl  = document.getElementById('mibBrowserTitle');
    const countEl  = document.getElementById('mibBrowserCount');
    const searchEl = document.getElementById('mibBrowserSearch');
    const treeEl   = document.getElementById('mibBrowserTree');
    const exAllEl  = document.getElementById('mibBrowserExpandAllLabel');
    if (titleEl)  titleEl.textContent = _ms('mib_browser', 'MIB Browser');
    if (countEl)  { countEl.textContent = ''; countEl.style.display = 'none'; }
    if (searchEl) { searchEl.value = ''; searchEl.placeholder = _ms('mib_browser_search', 'Search…'); }
    if (exAllEl)  exAllEl.textContent = _ms('mib_browser_expand_all', 'Expand all');
    if (treeEl)   treeEl.innerHTML = `<div class="text-center py-5"><div class="spinner-border spinner-border-sm"></div></div>`;

    bootstrap.Modal.getOrCreateInstance(document.getElementById('mibBrowserModal')).show();

    const cfg = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'get_all_symbols'), {...cfg});
    const d   = res && res.data;

    if (!d || !d.ok) {
        if (treeEl) treeEl.innerHTML = `<div class="text-danger text-center py-4 small">
            <i class="bi bi-exclamation-triangle me-1"></i>${esc((d && d.message) || 'Error')}
        </div>`;
        return;
    }

    _mibBrowserSymbols  = d.symbols || [];
    _mibBrowserTreeRoot = _mibBuildOidTree(_mibBrowserSymbols);
    _snmpRebuildOidMap();
    const countEl2 = document.getElementById('mibBrowserCount');
    // Explicit value: CSS hides #mibBrowserCount by default ('' wouldn't show it).
    if (countEl2) { countEl2.textContent = _mibBrowserSymbols.length; countEl2.style.display = 'inline-block'; }
    _mibBrowserRenderTree();
}

// Build an OID prefix tree from a flat symbol list.
// Parent of each symbol = the symbol with the longest OID that is a strict prefix.
function _mibBuildOidTree(symbols) {
    const sorted = symbols
        .filter(s => s.oid && /^\d[\d.]*\d$/.test(s.oid))
        .sort((a, b) => _mibOidCmp(a.oid, b.oid));

    const map  = new Map();
    const root = {oid: null, sym: null, children: []};

    for (const sym of sorted) {
        const node  = {oid: sym.oid, sym, children: []};
        map.set(sym.oid, node);
        const parts = sym.oid.split('.');
        let parent  = root;
        for (let len = parts.length - 1; len >= 1; len--) {
            const prefix = parts.slice(0, len).join('.');
            if (map.has(prefix)) { parent = map.get(prefix); break; }
        }
        parent.children.push(node);
    }
    return root;
}

// Return flat array of visible rows for current expand / filter state.
const _MIB_BROWSER_MAX_RESULTS = 300;

function _mibBrowserGetVisible() {
    const q = _mibBrowserFilter.toLowerCase();
    if (q) {
        const all = (_mibBrowserSymbols || [])
            .filter(s =>
                s.name.toLowerCase().includes(q) ||
                s.oid.includes(q)                ||
                (s.module || '').toLowerCase().includes(q) ||
                (s.desc   || '').toLowerCase().includes(q)
            )
            .sort((a, b) => _mibOidCmp(a.oid, b.oid));
        const rows = all.slice(0, _MIB_BROWSER_MAX_RESULTS)
            .map(s => ({sym: s, depth: 0, hasChildren: false, expanded: false, oid: s.oid}));
        if (all.length > _MIB_BROWSER_MAX_RESULTS)
            rows.push({_overflow: all.length});
        return rows;
    }
    if (!_mibBrowserTreeRoot) return [];
    const rows = [];
    function visit(node, depth) {
        for (const child of node.children) {
            const exp = _mibBrowserExpanded.has(child.oid);
            rows.push({sym: child.sym, depth, hasChildren: child.children.length > 0, expanded: exp, oid: child.oid});
            if (exp) visit(child, depth + 1);
        }
    }
    visit(_mibBrowserTreeRoot, 0);
    return rows;
}

function _mibBrowserToggle(oid) {
    if (_mibBrowserExpanded.has(oid)) _mibBrowserExpanded.delete(oid);
    else _mibBrowserExpanded.add(oid);
    _mibBrowserRenderTree();
}

function _mibBrowserFilterChange(val) {
    _mibBrowserFilter = val.trim();
    clearTimeout(_mibBrowserSearchTimer);
    _mibBrowserSearchTimer = setTimeout(_mibBrowserRenderTree, 250);
}

function _mibBrowserExpandAll() {
    if (!_mibBrowserSymbols) return;
    const allOids    = _mibBrowserSymbols.map(s => s.oid);
    const allExpanded = allOids.length && allOids.every(o => _mibBrowserExpanded.has(o));
    if (allExpanded) _mibBrowserExpanded.clear();
    else allOids.forEach(o => _mibBrowserExpanded.add(o));
    const lbl = document.getElementById('mibBrowserExpandAllLabel');
    if (lbl) lbl.textContent = _ms(
        _mibBrowserExpanded.size ? 'mib_browser_collapse_all' : 'mib_browser_expand_all',
        _mibBrowserExpanded.size ? 'Collapse all' : 'Expand all'
    );
    _mibBrowserRenderTree();
}

function _mibBrowserRenderTree() {
    const treeEl = document.getElementById('mibBrowserTree');
    if (!treeEl) return;

    if (!_mibBrowserSymbols) {
        treeEl.innerHTML = `<div class="text-center py-5"><div class="spinner-border spinner-border-sm"></div></div>`;
        return;
    }

    const rows = _mibBrowserGetVisible();
    if (!rows.length) {
        const q = _mibBrowserFilter;
        treeEl.innerHTML = `<div class="text-center text-muted py-5" style="font-size:.84rem">
            <i class="bi bi-${q ? 'search' : 'inbox'} d-block mb-2" style="font-size:1.4rem"></i>
            ${esc(q ? _ms('mib_no_match','No results') : _ms('mib_browser_empty','No compiled MIBs'))}
        </div>`;
        return;
    }

    const copyTitle = escAttr(_ms('mib_browser_copy_oid', 'Copy OID'));
    let h = '';
    for (const row of rows) {
        if (row._overflow) {
            h += `<div class="text-center text-muted py-2" style="font-size:.76rem;border-top:1px solid var(--bs-border-color)">
                <i class="bi bi-three-dots me-1"></i>${row._overflow} more results — refine your search
            </div>`;
            continue;
        }
        const s   = row.sym;
        const pad = `calc(.5rem + ${row.depth * 1.1}rem)`;
        const stCls = s.status === 'current'    ? 'bg-success'
                    : s.status === 'deprecated' ? 'bg-warning text-dark'
                    : s.status                  ? 'bg-secondary' : '';
        h += `<div class="d-flex align-items-start gap-1 py-1 pe-2"
                   style="border-bottom:1px solid var(--bs-border-color);padding-left:${pad}">
            <span class="flex-shrink-0 text-muted"
                  style="width:1rem;font-size:.72rem;padding-top:.18rem;
                         cursor:${row.hasChildren ? 'pointer' : 'default'}"
                  ${row.hasChildren ? `onclick="_mibBrowserToggle(${jsStr(row.oid)})"` : ''}>
                <i class="bi ${row.hasChildren
                    ? (row.expanded ? 'bi-chevron-down' : 'bi-chevron-right')
                    : 'bi-dot'}"></i>
            </span>
            <div class="flex-grow-1 min-w-0 ${row.hasChildren ? 'fw-semibold' : ''}"
                 style="${row.hasChildren ? 'cursor:pointer' : ''}"
                 ${row.hasChildren ? `onclick="_mibBrowserToggle(${jsStr(row.oid)})"` : ''}>
                <div class="d-flex align-items-center gap-1 flex-wrap">
                    <span style="font-size:.78rem">${esc(s.name)}</span>
                    ${stCls ? `<span class="badge ${stCls}" style="font-size:.58rem">${esc(s.status)}</span>` : ''}
                    ${s.type ? `<span class="text-secondary fw-normal" style="font-size:.66rem">${esc(s.type)}</span>` : ''}
                    ${s.units ? `<span class="text-muted fw-normal" style="font-size:.64rem">[${esc(s.units)}]</span>` : ''}
                    <span class="badge bg-secondary fw-normal ms-1"
                          style="font-size:.56rem;opacity:.6">${esc(s.module)}</span>
                </div>
                <div class="font-monospace text-muted fw-normal" style="font-size:.66rem">${esc(s.oid)}</div>
                ${!row.hasChildren && s.desc
                    ? `<div class="text-muted fw-normal" style="font-size:.66rem;white-space:normal">
                           ${esc(s.desc.length > 120 ? s.desc.slice(0,120)+'…' : s.desc)}
                       </div>`
                    : ''}
            </div>
            <button class="btn btn-sm btn-secondary py-0 px-1 flex-shrink-0"
                    style="margin-top:.1rem" title="${copyTitle}"
                    onclick="event.stopPropagation();_mibBrowserCopyOid(${jsStr(s.oid)})">
                <i class="bi bi-clipboard" style="font-size:.68rem"></i>
            </button>
        </div>`;
    }
    treeEl.innerHTML = h;
}

function _mibBrowserCopyOid(oid) {
    navigator.clipboard.writeText(oid).catch(() => {});
    showToast(oid);
}

// ── OID-aware check form enhancement ─────────────────────────────
// After _mibBrowserSymbols is loaded, build oid→symbol map so check
// forms can adapt value/operator controls to the OID's actual type.
let _snmpSymsByOid         = null;   // Map<oid, symbol> built from browser data
let _snmpOrigValueHtml     = {};     // itemPath → original input-group innerHTML (for restore)
let _snmpOidEnhanceTimers  = {};     // fieldPath → debounce handle

// Build/rebuild the oid→symbol lookup map.  Called after symbols load.
function _snmpRebuildOidMap() {
    if (!_mibBrowserSymbols) return;
    _snmpSymsByOid = new Map(_mibBrowserSymbols.map(s => [s.oid, s]));
}

// Safe deep-get from modulesData: 'snmp|servers|s1|checks|c1|oid' → value
function _snmpGetVal(dotPath) {
    try {
        return dotPath.split('|').reduce((o, k) => (o != null ? o[k] : undefined), modulesData) ?? '';
    } catch { return ''; }
}

// Event delegation: watch for changes on any [data-field-path$="|oid"] input
document.addEventListener('change', function(ev) {
    const inp = ev.target;
    if (!inp || !inp.dataset) return;
    const fp = inp.dataset.fieldPath || '';
    if (!fp.endsWith('|oid')) return;
    if (!_mibManagerModuleName || !fp.startsWith(_mibManagerModuleName + '|')) return;
    clearTimeout(_snmpOidEnhanceTimers[fp]);
    _snmpOidEnhanceTimers[fp] = setTimeout(() => _snmpHandleOidChange(inp, fp), 150);
});

// Map pysnmp type name → operator category (no MIB browser needed)
function _snmpCatFromTypeName(typeName) {
    if (!typeName) return null;
    const t = typeName.toLowerCase();
    if (t === 'truthvalue' || t === 'integer' && typeName !== 'Integer') return 'boolean';
    if (/integer|gauge|counter|ticks|unsigned/.test(t)) return 'integer';
    if (t === 'ipaddress') return 'ip';
    if (/string|display|text|octet/.test(t)) return 'string';
    return null;
}

// Apply operator filtering + value enhancement using only the stored snmp_type
// (no MIB browser required — works from data persisted at discover time)
function _snmpApplyTypeToForm(itemPath, typeName) {
    const cat = _snmpCatFromTypeName(typeName);
    if (!cat) return;
    // Reuse the existing operator enhance logic via a minimal sym-like object
    _snmpEnhanceOperatorControl(itemPath, {base_category: cat});
}

// Re-apply enhancements when an already-configured check panel opens
document.addEventListener('shown.bs.collapse', function(ev) {
    const itemPath = ev.target && ev.target.dataset.swItemPath;
    if (!itemPath || !itemPath.includes('|checks|')) return;
    if (!_mibManagerModuleName || !itemPath.startsWith(_mibManagerModuleName + '|')) return;

    // Prefer stored snmp_type (no MIB browser needed) then fall back to live lookup
    const snmpType = String(_snmpGetVal(itemPath + '|snmp_type') || '').trim();
    if (snmpType) {
        _snmpApplyTypeToForm(itemPath, snmpType);
        return;
    }
    const oidVal = String(_snmpGetVal(itemPath + '|oid') || '').trim();
    if (!oidVal || !_snmpSymsByOid) return;
    const sym = _snmpSymsByOid.get(oidVal);
    if (sym) _snmpApplyOidInfo(itemPath, sym);
});

function _snmpHandleOidChange(inputEl, fieldPath) {
    const oid      = (inputEl.value || '').trim();
    const itemPath = fieldPath.replace(/\|oid$/, '');

    if (!oid) {
        _snmpRestoreValueControl(itemPath);
        _snmpRestoreOperatorControl(itemPath);
        return;
    }

    // Enhance only if symbols are already loaded via the MIB Browser.
    // Never trigger get_all_symbols here — that's a blocking operation that
    // would queue behind Flask's single-threaded request handler and delay
    // other requests (e.g., Discover OIDs).
    if (!_snmpSymsByOid) return;
    const sym = _snmpSymsByOid.get(oid);
    if (sym) _snmpApplyOidInfo(itemPath, sym);
}

function _snmpApplyOidInfo(itemPath, sym) {
    _snmpEnhanceValueControl(itemPath, sym);
    _snmpEnhanceOperatorControl(itemPath, sym);
}

function _snmpEnhanceValueControl(itemPath, sym) {
    const wrapper = document.querySelector(
        `[data-cfg-path="${CSS.escape(itemPath + '|value')}"]`
    );
    if (!wrapper) return;
    const ig = wrapper.querySelector('.input-group');
    if (!ig) return;

    // Save original HTML once so we can restore it
    if (!_snmpOrigValueHtml[itemPath]) _snmpOrigValueHtml[itemPath] = ig.innerHTML;

    const curVal = String(_snmpGetVal(itemPath + '|value') || '');
    const sp     = jsStr(itemPath + '|value');

    if (sym.base_category === 'enum' || sym.base_category === 'boolean') {
        const opts = (sym.enum_values || []).map(ev => {
            const sel = (String(ev.value) === curVal || ev.name === curVal) ? ' selected' : '';
            return `<option value="${ev.value}"${sel}>${esc(ev.name)} (${ev.value})</option>`;
        }).join('');
        ig.innerHTML =
            `<select class="form-select form-select-sm"
                     onchange="updateField('modules',${sp},this.value);markDirty('modules')">
                 <option value="">—</option>${opts}
             </select>`;

    } else if (sym.base_category === 'integer' || sym.base_category === 'unsigned') {
        const minA  = sym.range_min != null ? ` min="${sym.range_min}"` : '';
        const maxA  = sym.range_max != null ? ` max="${sym.range_max}"` : '';
        const hint  = (sym.range_min != null && sym.range_max != null)
            ? `<span class="input-group-text" style="font-size:.72rem">${sym.range_min}..${sym.range_max}</span>`
            : '';
        const uspan = sym.units
            ? `<span class="input-group-text" style="font-size:.72rem">${esc(sym.units)}</span>` : '';
        ig.innerHTML =
            `<input type="number" class="form-control form-control-sm"
                    data-field-path="${escAttr(itemPath + '|value')}"
                    value="${escAttr(curVal)}"${minA}${maxA}
                    oninput="markDirty('modules')"
                    onchange="updateField('modules',${sp},this.value)">${hint}${uspan}`;

    } else {
        _snmpRestoreValueControl(itemPath);
    }
}

function _snmpEnhanceOperatorControl(itemPath, sym) {
    const wrapper = document.querySelector(
        `[data-cfg-path="${CSS.escape(itemPath + '|operator')}"]`
    );
    if (!wrapper) return;
    const sel = wrapper.querySelector('select');
    if (!sel) return;

    const allowed =
        (sym.base_category === 'enum' || sym.base_category === 'boolean')
            ? new Set(['any', 'eq', 'ne'])
        : (sym.base_category === 'integer' || sym.base_category === 'unsigned')
            ? new Set(['any', 'eq', 'ne', 'gt', 'lt', 'gte', 'lte'])
        : (sym.base_category === 'string')
            ? new Set(['any', 'eq', 'ne', 'contains', 'regex'])
        : null;   // null = all allowed

    sel.querySelectorAll('option').forEach(opt => {
        const hide = allowed ? !allowed.has(opt.value) : false;
        opt.disabled      = hide;
        opt.style.display = hide ? 'none' : '';
        if (hide && opt.selected) {
            const first = [...sel.options].find(o => !o.disabled);
            if (first) {
                first.selected = true;
                updateField('modules', itemPath + '|operator', first.value);
            }
        }
    });
}

function _snmpRestoreValueControl(itemPath) {
    const orig = _snmpOrigValueHtml[itemPath];
    if (!orig) return;
    const wrapper = document.querySelector(
        `[data-cfg-path="${CSS.escape(itemPath + '|value')}"]`
    );
    if (wrapper) {
        const ig = wrapper.querySelector('.input-group');
        if (ig) ig.innerHTML = orig;
    }
    delete _snmpOrigValueHtml[itemPath];
}

function _snmpRestoreOperatorControl(itemPath) {
    const wrapper = document.querySelector(
        `[data-cfg-path="${CSS.escape(itemPath + '|operator')}"]`
    );
    if (!wrapper) return;
    const sel = wrapper.querySelector('select');
    if (!sel) return;
    sel.querySelectorAll('option').forEach(opt => {
        opt.disabled = false; opt.style.display = '';
    });
}

// ── MIB Details modal ─────────────────────────────────────────────
async function _mibShowDetails(name) {
    const titleEl = document.getElementById('mibDetailsTitle');
    const bodyEl  = document.getElementById('mibDetailsBody');
    if (titleEl) titleEl.textContent = name;
    if (bodyEl)  bodyEl.innerHTML = `<div class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></div>`;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('mibDetailsModal')).show();

    const modName = _mibManagerModuleName;
    const cfg     = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'get_mib_details'), { ...cfg, name });
    const d   = res && res.data;

    if (!d || !d.ok) {
        if (bodyEl) bodyEl.innerHTML = `<div class="text-danger small">
            <i class="bi bi-exclamation-triangle me-1"></i>${esc((d && d.message) || (t('error') || 'Error'))}
        </div>`;
        return;
    }

    const symLabel = _ms('mib_details_symbols', 'symbols');
    const noSyms   = _ms('mib_details_no_symbols', 'No symbols loaded — pysnmp unavailable or module failed to load');
    const srcLabel = _ms('mib_details_source', 'Source code');
    const thStyle  = 'cursor:pointer;user-select:none;white-space:nowrap';
    const sortIcon = '<i class="mib-sort-icon bi bi-sort ms-1 opacity-25" style="font-size:.75em"></i>';

    let h = '';

    // Two tabs, the same pair the raw viewer has: what it declares, and what it says. The
    // symbol table is what a compiled MIB is opened for; the generated module is the answer
    // to "did it really compile THAT", which is a question that comes second.
    h += `<ul class="nav nav-tabs mb-2 flex-shrink-0" role="tablist">
        <li class="nav-item"><button class="nav-link active"
                data-bs-toggle="tab" data-bs-target="#mibTabDecl" type="button" role="tab">
            <i class="bi bi-list-ul me-1"></i>${esc(symLabel)}
        </button></li>
        <li class="nav-item"><button class="nav-link" id="mibTabCodeBtn"
                data-bs-toggle="tab" data-bs-target="#mibTabCode" type="button" role="tab">
            <i class="bi bi-code-slash me-1"></i>${esc(srcLabel)}
        </button></li>
    </ul>
    <div class="tab-content ss-vfill">
    <div class="tab-pane fade show active ss-vfill ss-vscroll ss-scroll-pad"
         id="mibTabDecl" role="tabpanel">`;

    // ── Symbol table ──────────────────────────────────────────────
    if (d.symbols && d.symbols.length) {
        _mibDetailsData = {type: 'compiled', rows: d.symbols};
        _mibDetailsSort = {col: 0, asc: true};
        h += `<div class="mb-3">
            <div class="text-muted mb-1" style="font-size:.78rem">
                <i class="bi bi-list-ul me-1"></i>${d.symbols.length} ${esc(symLabel)}
            </div>
            <table class="table table-sm table-bordered mb-0" style="font-size:.76rem">
                <thead id="mibDetailsThead" class="sticky-top"
                       style="background:var(--bs-tertiary-bg);color:var(--bs-emphasis-color)">
                    <tr>
                        <th style="${thStyle}" onclick="_mibSortDetails(0)">${esc(_ms('mib_details_th_name','Name'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(1)">${esc(_ms('mib_details_th_oid','OID'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(2)">${esc(_ms('mib_details_th_type','Type'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(3)">${esc(_ms('mib_details_th_units','Units'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(4)">${esc(_ms('mib_details_th_access','Access'))}${sortIcon}</th>
                    </tr>
                </thead>
                <tbody id="mibDetailsTbody"></tbody>
            </table>
        </div>`;
    } else {
        _mibDetailsData = null;
        h += `<div class="text-muted mb-3 small"><i class="bi bi-info-circle me-1"></i>${esc(noSyms)}</div>`;
    }

    // ── …and the module pysmi wrote, in its own tab ───────────────
    h += `</div>
    <div class="tab-pane fade ss-vfill" id="mibTabCode" role="tabpanel">
        <div class="mib-src ss-vfill" id="mibSourceBox"></div>
    </div>
    </div>`;

    if (bodyEl) {
        bodyEl.innerHTML = h;
        if (_mibDetailsData) _mibRenderDetailsTbody();
        _mibSrcEditor = null;
        _mibRenderSource(document.getElementById('mibSourceBox'), d.source, 0, 'pysnmp');
        // Built behind the other tab it has no size to measure and comes out a few pixels
        // tall; it has to look again when the tab it is on becomes the open one.
        const codeBtn = document.getElementById('mibTabCodeBtn');
        if (codeBtn) {
            codeBtn.addEventListener('shown.bs.tab', () => {
                if (_mibSrcEditor) _mibSrcEditor.refresh();
            });
        }
    }
}

// What the file DECLARES — imports and objects — as the inner HTML of its own pane.
//
// A function rather than a stretch of the renderer because it has to be redrawn on its own:
// saving an edit changes what the file declares, and the alternative was rebuilding the whole
// modal, which threw away the editor, the scroll position and the tab you were on to change
// one table.
function _mibDeclHtml(d) {
    const thStyle  = 'cursor:pointer;user-select:none;white-space:nowrap';
    const sortIcon = '<i class="mib-sort-icon bi bi-sort ms-1 opacity-25" style="font-size:.75em"></i>';
    let h = '';

    if (d.imports && d.imports.length) {
        h += `<details class="mb-3">
            <summary class="fw-semibold" style="font-size:.82rem;cursor:pointer;user-select:none">
                <i class="bi bi-box-arrow-in-down me-1"></i>${esc(_ms('mib_details_imports', 'Imports'))}
                <span class="badge bg-secondary ms-1" style="font-size:.65rem">${d.imports.length}</span>
            </summary>
            <div class="mt-2" style="max-height:18vh;overflow-y:auto">`;
        for (const imp of d.imports) {
            h += `<div class="mb-1">
                <span class="badge bg-secondary me-1" style="font-size:.68rem">${esc(imp.module)}</span>
                <span class="text-muted" style="font-size:.72rem">${imp.symbols.map(s => esc(s)).join(', ')}</span>
            </div>`;
        }
        h += `</div></details>`;
    }

    const dets = d.objects_detail || [];
    if (dets.length) {
        _mibDetailsData = {type: 'raw', rows: dets};
        _mibDetailsSort = {col: 0, asc: true};
        h += `<div class="mb-3">
            <div class="text-muted mb-1" style="font-size:.78rem">
                <i class="bi bi-list-ul me-1"></i>${dets.length} ${esc(_ms('mib_details_objects', 'objects'))}
            </div>
            <table class="table table-sm table-bordered mb-0" style="font-size:.76rem">
                <thead id="mibDetailsThead" class="sticky-top"
                       style="background:var(--bs-tertiary-bg);color:var(--bs-emphasis-color)">
                    <tr>
                        <th style="${thStyle}" onclick="_mibSortDetails(0)">${esc(_ms('mib_details_th_name','Name'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(1)">${esc(_ms('mib_details_th_syntax','Syntax'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(2)">${esc(_ms('mib_details_th_units','Units'))}${sortIcon}</th>
                        <th style="${thStyle}" onclick="_mibSortDetails(3)">${esc(_ms('mib_details_th_access','Access'))}${sortIcon}</th>
                    </tr>
                </thead>
                <tbody id="mibDetailsTbody"></tbody>
            </table>
        </div>`;
    } else {
        // A pane with nothing in it reads as a screen that failed to load, and a MIB whose
        // syntax broke mid-file really does declare nothing this parser can see — which is
        // worth saying, since the source tab next door is where the answer is.
        _mibDetailsData = null;
        h += `<div class="text-muted text-center py-4" style="font-size:.82rem">
            <i class="bi bi-list-ul d-block mb-1" style="font-size:1.6rem;opacity:.35"></i>
            ${esc(_ms('mib_details_none', 'Nothing declared that could be read'))}
        </div>`;
    }
    return h;
}

// Redraw ONLY that pane, from the file as it is now. Called after a save: what the file
// declares has changed, and the tab showing the old objects is quietly wrong.
async function _mibDeclRefresh() {
    const pane = document.getElementById('mibTabDecl');
    if (!pane || !_mibEditName) return;
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'get_raw_mib_details'),
                              { ...(modulesData[modName] || {}), name: _mibEditName });
    const d = res && res.data;
    if (!d || !d.ok) return;
    pane.innerHTML = _mibDeclHtml(d);
    if (_mibDetailsData) _mibRenderDetailsTbody();
    const cnt = document.getElementById('mibDetailsObjCount');
    if (cnt) cnt.textContent = `${(d.objects || []).length} ${_ms('mib_details_objects', 'objects')}`;
}

async function _mibShowRawDetails(name, line) {
    const titleEl = document.getElementById('mibDetailsTitle');
    const bodyEl  = document.getElementById('mibDetailsBody');
    if (titleEl) titleEl.textContent = name;
    if (bodyEl)  bodyEl.innerHTML = `<div class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></div>`;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('mibDetailsModal')).show();

    const modName = _mibManagerModuleName;
    const cfg     = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'get_raw_mib_details'), { ...cfg, name });
    const d   = res && res.data;

    if (!d || !d.ok) {
        if (bodyEl) bodyEl.innerHTML = `<div class="text-danger small">
            <i class="bi bi-exclamation-triangle me-1"></i>${esc((d && d.message) || (t('error') || 'Error'))}
        </div>`;
        return;
    }

    const srcLabel = _ms('mib_details_source', 'Source code');
    const thStyle  = 'cursor:pointer;user-select:none;white-space:nowrap';
    const sortIcon = '<i class="mib-sort-icon bi bi-sort ms-1 opacity-25" style="font-size:.75em"></i>';

    let h = '';

    // Which tab opens: what it DECLARES is what a MIB is normally opened for, but arriving
    // from a compile error the question is already "what is on line 21", and one more click
    // between the reason and the line is the click that loses it.
    const codeFirst = line > 0;

    // ── Module header ─────────────────────────────────────────────
    if (d.module) {
        h += `<div class="d-flex align-items-center gap-2 mb-2 p-2 rounded flex-shrink-0"
                   style="background:var(--bs-secondary-bg);font-size:.82rem">
            <i class="bi bi-diagram-3 text-primary flex-shrink-0"></i>
            <span class="fw-semibold">${esc(d.module)}</span>
            <span class="text-muted ms-auto" id="mibDetailsObjCount">${d.objects.length} ${esc(_ms('mib_details_objects', 'objects'))}</span>
        </div>`;
    }

    // ── Two tabs: what it declares, and what it says ──────────────
    h += `<ul class="nav nav-tabs mb-2 flex-shrink-0" role="tablist">
        <li class="nav-item"><button class="nav-link ${codeFirst ? '' : 'active'}"
                data-bs-toggle="tab" data-bs-target="#mibTabDecl" type="button" role="tab">
            <i class="bi bi-list-ul me-1"></i>${esc(_ms('mib_tab_declares', 'Declarations'))}
        </button></li>
        <li class="nav-item"><button class="nav-link ${codeFirst ? 'active' : ''}"
                id="mibTabCodeBtn" data-bs-toggle="tab" data-bs-target="#mibTabCode"
                type="button" role="tab">
            <i class="bi bi-file-earmark-text me-1"></i>${esc(srcLabel)}
            ${line > 0 ? `<span class="badge bg-danger ms-1" style="font-size:.62rem">${esc(_ms('mib_error_line', 'line'))} ${line}</span>` : ''}
        </button></li>
    </ul>
    <div class="tab-content ss-vfill">
    <div class="tab-pane fade ${codeFirst ? '' : 'show active'} ss-vfill ss-vscroll ss-scroll-pad"
         id="mibTabDecl" role="tabpanel">`;

    h += _mibDeclHtml(d);

    // ── …and the source, in its own tab ───────────────────────────
    h += `</div>
    <div class="tab-pane fade ${codeFirst ? 'show active' : ''} ss-vfill"
         id="mibTabCode" role="tabpanel">
        <div class="d-flex align-items-center gap-2 flex-wrap mb-2 flex-shrink-0"
             id="mibEditBar"></div>
        <div id="mibVersionsBox" class="flex-shrink-0" style="display:none"></div>
        <div class="mib-src ss-vfill" id="mibSourceBox"></div>
    </div>
    </div>`;

    if (bodyEl) {
        bodyEl.innerHTML = h;
        if (_mibDetailsData) _mibRenderDetailsTbody();
        _mibSrcEditor = null;
        _mibEditReset(name);
        _mibEditRenderBar();
        _mibVersionsLoad(name);
        _mibRenderSource(document.getElementById('mibSourceBox'), d.source, line);
        // CodeMirror measures itself when it is built, and a hidden tab has no size to
        // measure: built behind the other tab it comes out a few pixels tall and stays that
        // way until something makes it look again.
        const codeBtn = document.getElementById('mibTabCodeBtn');
        if (codeBtn) {
            codeBtn.addEventListener('shown.bs.tab', () => {
                if (_mibSrcEditor) _mibSrcEditor.refresh();
            });
        }
    }
}

// ── Live list refresh during compilation ──────────────────────────
// Re-reads the compiled files only, and re-renders.  The selection survives because it is
// keyed by module name, and a module does not change name by being compiled — which is the
// whole reason the list is keyed that way.
async function _mibRefreshCompiled() {
    if (_mibRefreshingCompiled || !_mibData || !_mibManagerModuleName) return;
    _mibRefreshingCompiled = true;
    try {
        const modName = _mibManagerModuleName;
        const res = await apiPost(_mibApiUrl(modName, 'list_mibs'), modulesData[modName] || {});
        const d   = res && res.data;
        if (!d || !d.ok || !_mibData) return;
        _mibData.compiled = d.compiled;
        _mibData.errors   = d.errors || {};
        _mibFilterLists();
    } finally {
        _mibRefreshingCompiled = false;
    }
}

// ── Multi-select helpers ──────────────────────────────────────────
function _mibToggleSelect(mib) {
    if (_mibSelection.has(mib)) _mibSelection.delete(mib);
    else                        _mibSelection.add(mib);
    _mibUpdateDeleteBtn();
}

// The count on the main compile button: pressing it and being told a number you had no way of
// predicting is how "compile pending" came to look like it was doing something else.
function _mibUpdateCompileBtn() {
    const lbl = document.getElementById('mibCompileBtnLabel');
    if (!lbl || _mibCompileInProgress) return;
    // From the server, which is where the decision is made. A row is a module and the job
    // walks file names, and the two differ whenever a module arrives twice under different
    // names — which in a vendor archive is most of them.
    const n = (_mibData && _mibData.pending)
        ? _mibData.pending.length : _mibToCompile().length;
    lbl.textContent = _ms('mib_compile_pending', 'Compile pending') + (n ? ` (${n})` : '');
}

function _mibUpdateDeleteBtn() {
    const n   = _mibSelection.size;
    // The GROUP, not the button inside it: hiding the button alone would leave its caret
    // sitting there on its own.
    const btn = document.getElementById('mibDeleteSelGroup');
    const cnt = document.getElementById('mibDeleteSelCount');
    if (btn) btn.style.display = n > 0 ? '' : 'none';
    if (cnt) cnt.textContent = String(n);
    _mibUpdateCompileSelBtn();
}

// Only a module with a source can be compiled: selecting a dependency (a .py pysmi pulled
// in, with no .mib of its own) must not offer to compile something that is not there.
function _mibUpdateCompileSelBtn() {
    const n   = _mibRows().filter(r => _mibSelection.has(r.mib) && r.raws.length).length;
    const btn = document.getElementById('mibCompileSelBtn');
    const cnt = document.getElementById('mibCompileSelCount');
    if (btn) btn.style.display = n > 0 ? '' : 'none';
    if (cnt) cnt.textContent = String(n);
}

function _mibSelectAll() {
    _mibVisibleRows().forEach(r => _mibSelection.add(r.mib));
    _mibFilterLists();
}

function _mibDeselectAll() {
    _mibSelection.clear();
    _mibFilterLists();
}

// ── What a deletion left behind ───────────────────────────────────
//
// Deleting a folder of sources cannot delete what was compiled from them: a compiled module
// is a file of its own, flat in `compiled/`, named after the MODULE and carrying no trace of
// the folder it came from. Nothing in the library's shape says "these 374 .py files were that
// vendor's" — pysmi's own header does, and that is what this reads.
async function _mibCleanLibrary() {
    const modName = _mibManagerModuleName;
    if (!modName) return;
    const cfg = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'library_leftovers'), cfg);
    const d   = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    const py   = (d.stray || []).length;
    const dirs = (d.empty_dirs || []).length;
    if (!py && !dirs) {
        showToast(_ms('mib_clean_nothing', 'Nothing left over — the library is tidy'));
        return;
    }
    // What goes, said in the two units it is measured in, and the first few by name: a
    // number alone is not something anybody can check before agreeing to it.
    const lines = [];
    if (py) lines.push(_ms('mib_clean_stray_n', '{n} compiled module(s) with no source ({size})')
        .replace('{n}', py).replace('{size}', _mibSz(d.stray_bytes || 0)));
    if (dirs) lines.push(_ms('mib_clean_dirs_n', '{n} empty folder(s)').replace('{n}', dirs));
    const sample = (d.stray || []).slice(0, 5).map(e => e.mib)
        .concat((d.empty_dirs || []).slice(0, 5));
    showConfirmModal(
        _ms('mib_clean_confirm', 'Delete what is left over? {what}')
            .replace('{what}', lines.join(' · '))
        + (sample.length ? ' — ' + sample.join(', ') + (py + dirs > sample.length ? '…' : '') : ''),
        () => _mibCleanConfirmed());
}

async function _mibCleanConfirmed() {
    const modName = _mibManagerModuleName;
    const cfg = modulesData[modName] || {};
    const res = await apiPost(_mibApiUrl(modName, 'clean_library'), cfg);
    const d   = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    showToast(_ms('mib_clean_done', '{n} compiled module(s) and {d} folder(s) removed')
        .replace('{n}', d.compiled_deleted || 0).replace('{d}', d.folders_removed || 0));
    await _mibLoad();
}

// ── Deleting ──────────────────────────────────────────────────────
// A row is a module, so deleting one deletes every file it stands for: its source (or
// sources — two vendors can ship the same module) and its compiled .py.  The count in the
// confirmation is the count of FILES, because that is what is about to disappear.
function _mibDeleteSelected(scope) {
    const items = _mibArtifacts(_mibRows().filter(r => _mibSelection.has(r.mib)), scope);
    // A selection can hold nothing of the kind asked for — every row picked is still
    // uncompiled, say. Silence there reads as a click that did not register.
    if (!items.length) {
        showToast(_ms('mib_delete_none_of_that', 'Nothing of that kind in the selection'));
        return;
    }
    showConfirmModal(
        _mibDeleteMsg(scope, true).replace('{n}', items.length),
        () => _mibDeleteConfirmed(items));
}

function _mibDeleteRow(mib, scope) {
    const row = _mibRows().find(r => r.mib === mib);
    const items = _mibArtifacts(row ? [row] : [], scope);
    if (!items.length) return;
    // The history is offered here and NOT taken by default: the ordinary reason to delete a
    // raw MIB is to import it again cleanly, and that is exactly when the edit that came
    // before is worth still having. But asking in its own dialog afterwards is asking once
    // the moment has passed, and never asking is what leaves a history nobody can reach.
    // …and only when the source is what goes: the history is the history OF the source, and
    // a .py is not something anybody edited.
    const opts = (row && row.version > 1 && scope !== 'compiled')
        ? {check: {label: _ms('mib_delete_with_history', 'Delete its {n} stored version(s) too')
                          .replace('{n}', row.version), checked: false}}
        : {};
    showConfirmModal(
        _mibDeleteMsg(scope, false).replace('{name}', mib).replace('{n}', items.length),
        (alsoHistory) => _mibDeleteConfirmed(items, !!alsoHistory),
        opts);
}

// What is being deleted is half the question; what SURVIVES is the other half, and it is the
// half somebody gets wrong. Deleting the source leaves a compiled module that stays in use,
// which does not look like a deletion at all until the next compile.
function _mibDeleteMsg(scope, many) {
    if (scope === 'compiled') {
        return many
            ? _ms('mib_delete_sel_compiled_confirm',
                  'Delete the compiled module of {n} MIB(s)? Their sources stay.')
            : _ms('mib_delete_compiled_confirm',
                  'Delete the compiled module of {name}? The source stays — compiling it '
                  + 'again is what brings it back.');
    }
    if (scope === 'raw') {
        return many
            ? _ms('mib_delete_sel_raw_confirm',
                  'Delete the source of {n} MIB(s)? Their compiled modules stay, and stay in use.')
            : _ms('mib_delete_raw_confirm',
                  'Delete the source of {name}? The compiled module stays, and stays in use '
                  + 'until it goes too.');
    }
    return many ? _ms('mib_delete_selected_confirm', 'Delete {n} file(s)?')
                : _ms('mib_delete_module_confirm', 'Delete {name} and its {n} file(s)?');
}

async function _mibDeleteConfirmed(items, withHistory) {
    const modName = _mibManagerModuleName;
    const cfg     = modulesData[modName] || {};
    const total   = items.length;
    let deleted   = 0;
    const errors  = [];

    _mibProgressBegin(false);   // delete is not cancellable → no Stop button
    _mibProgressRender('deleting', 0, total, null, 0);
    for (let i = 0; i < items.length; i++) {
        const it = items[i];
        _mibProgressRender('deleting', i, total, it.name, 0);
        const res = await apiPost(_mibApiUrl(modName, 'delete_mib'),
                                  { ...cfg, name: it.name, kind: it.kind,
                                    with_history: !!withHistory && it.kind === 'raw' });
        const d   = res && res.data;
        if (d && d.ok) { deleted++; }
        else { errors.push(it.name + ': ' + ((d && d.message) || 'Error')); }
    }
    _mibProgressRender('deleting', total, total, null, 0);
    await new Promise(r => setTimeout(r, 300));
    _mibProgressHide();

    if (deleted) showToast(
        _ms('mib_n_deleted', '{n} file(s) deleted').replace('{n}', deleted)
    );
    for (const e of errors) showToast(e, 'error');
    await _mibLoad();
}

function _compileSelected() {
    const names = _mibRows().filter(r => _mibSelection.has(r.mib) && r.raws.length)
                            .map(r => r.raws[0]);
    if (names.length) _compileMibs(names);
}

// ── Progress helpers (shared by download / compile / index phases) ────────────
// The progress bar carries a phase label so the user always knows what the job
// is doing; the Stop button is visible for the whole job (any phase).
function _mibPhaseLabel(phase) {
    return {
        downloading: _ms('mib_phase_downloading', 'Downloading'),
        discovering: _ms('mib_github_discovering', 'Discovering files…'),
        compiling:   _ms('mib_phase_compiling',   'Compiling'),
        indexing:    _ms('mib_phase_indexing',    'Indexing…'),
        deleting:    _ms('mib_phase_deleting',    'Deleting'),
        comparing:   _ms('mib_phase_comparing',   'Comparing'),
        importing:   _ms('mib_phase_importing',   'Importing'),
        cancelling:  _ms('mib_phase_cancelling',  'Cancelling…'),
    }[phase] || '';
}

// ONE progress bar, wherever the section happens to be showing. Both views ship the same
// ids — a `<template>` is inert, so only the view that was cloned is ever in the document —
// and that is what makes a job survive a change of view: start a download on the import
// view, go back to the list, and the bar and its Stop are there, counting.
//
// Show the progress section.  *withStop* shows the Stop button for cancellable
// jobs (download / compile / index); pass false for non-cancellable ones (delete).
function _mibProgressBegin(withStop = true) {
    const sec = document.getElementById('mibProgressSection');
    // Must be an explicit value: the stylesheet hides `.mib-progress`, so clearing the
    // inline style ('') would keep it hidden.
    if (sec) sec.style.display = 'block';
    const stop = document.getElementById('mibStopBtn');
    if (stop) stop.style.display = withStop ? 'inline-block' : 'none';
}

// Render one progress tick.  Determinate (X / total) when *total* > 0; otherwise
// an indeterminate full striped bar (discovery / indexing — no known total).
function _mibProgressRender(phase, completed, total, current, failed, unit = '') {
    const name  = _mibPhaseLabel(phase);
    const bar   = document.getElementById('mibProgressBar');
    const lbl   = document.getElementById('mibProgressLabel');
    const pctEl = document.getElementById('mibProgressPct');
    if (total > 0) {
        const pct = Math.round((completed / total) * 100);
        if (bar) { bar.style.width = `${pct}%`; bar.setAttribute('aria-valuenow', pct); }
        const count = `${completed} / ${total}${unit ? ' ' + unit : ''}`;
        if (lbl) lbl.textContent = current ? `${name} ${count} — ${current}`
                                           : `${name} ${count}`;
        if (pctEl) pctEl.textContent = failed
            ? _ms('mib_github_progress_failed', '{f} failed').replace('{f}', failed)
            : `${pct}%`;
    } else {
        if (bar) bar.style.width = '100%';
        if (lbl) lbl.textContent = current ? `${name} — ${current}` : name;
        if (pctEl) pctEl.textContent = '';
    }
}

// Hide the progress section and the Stop button.
function _mibProgressHide() {
    const sec = document.getElementById('mibProgressSection');
    if (sec) sec.style.display = 'none';
    const bar = document.getElementById('mibProgressBar');
    if (bar) bar.style.width = '0%';
    const stop = document.getElementById('mibStopBtn');
    if (stop) stop.style.display = 'none';
}

// " — 97 requested, 23 dependencies, 120 total", or '' if nothing extra to say.
// pysmi auto-compiles dependency MIBs, so compiled/ holds more files than were
// requested; this explains the larger count to the user.
function _mibBreakdownSuffix() {
    const b = _mibCompiledBreakdown();
    if (!b.deps) return '';
    return ' — ' + _ms('mib_compiled_breakdown',
        '{req} requested, {dep} dependencies, {total} total')
        .replace('{req}', b.requested).replace('{dep}', b.deps).replace('{total}', b.total);
}

function _mibHandleCompileResult(d) {
    if (d.up_to_date) {
        // A job that finds nothing to do and ends instantly, silently, is a button that
        // looks broken — which is the exact reading this whole modal has had to unlearn.
        showToast(_ms('mib_already_uptodate', 'MIBs already up-to-date'));
        return;
    }
    if (d.cancelled) {
        showToast(d.message || _ms('mib_compile_cancelled', 'Compilation cancelled'), 'warning');
        return;
    }
    const _errs = Object.values(d.errors || {});
    if (d.result_ok === false) {
        showToast(_errs.length === 1 ? _errs[0] : (d.message || (t('error') || 'Error')),
                  'error');
    } else if (d.partial) {
        const nFailed = (d.failed || []).length;
        const nOk     = (d.total || 0) - nFailed;
        showToast(
            _ms('mib_compiled_partial', '{compiled} compiled, {failed} failed')
                .replace('{compiled}', nOk)
                .replace('{failed}', nFailed) + _mibBreakdownSuffix(),
            'warning',
        );
    } else if (d.compiled) {
        showToast(_ms('mib_compiled_ok', 'MIBs compiled successfully') + _mibBreakdownSuffix());
    } else {
        showToast(_ms('mib_already_uptodate', 'MIBs already up-to-date'));
    }
}

// Nothing intercepts leaving any more, and that is the point of a section.
//
// The modal asked "cancel the ongoing compilation and close?" because closing it stopped the
// poll loop, and a compile with nobody watching looked stopped. A compile has never been a
// thing the browser was doing: it runs server-side under a job id, and the panel polls it. So
// walking away is now walking away — the job carries on, and coming back to the section picks
// the progress up where it is. Cancelling is the Stop button, which says so.

async function _mibStopCompile() {
    // Stop the active job.  A compile is cancelled SERVER-SIDE (just stopping the
    // poll loop would leave the background thread compiling — files would keep
    // appearing); the loop keeps polling and shows "Cancelling…" until the
    // server confirms it stopped.  A GitHub import poll is aborted client-side.
    _mibGithubAbort = true;
    if (_mibCompileJobId && !_mibCompileCancelling) {
        _mibCompileCancelling = true;
        const stopBtn = document.getElementById('mibStopBtn');
        if (stopBtn) stopBtn.disabled = true;
        const modName = _mibManagerModuleName;
        try {
            await apiPost(_mibApiUrl(modName, 'compile_mibs_cancel'),
                          { ...(modulesData[modName] || {}), job_id: _mibCompileJobId });
        } catch (e) { /* best effort */ }
    } else if (!_mibCompileJobId) {
        _mibCompileAbort = true;   // no compile job → just stop polling
    }
}

// What "compile pending" will actually walk: everything with a source and no module up to
// date behind it. The same three states the chips now show, which is the point — the button
// and the list have to be answering the same question.
function _mibToCompile() {
    return _mibRows().filter(
        r => r.raws.length && (r.state === 'pending' || r.state === 'stale'
                               || r.state === 'failed'));
}

// Rebuilding everything is slow and almost never what you want, which is why it is behind
// the dropdown and says so before it starts.
function _mibRebuildAll() {
    const n = _mibRows().filter(r => r.raws.length).length;
    showConfirmModal(
        _ms('mib_rebuild_confirm', 'Recompile all {n} MIBs, including the ones already up to date?')
            .replace('{n}', n),
        () => _compileMibs(null, 'all'));
}

async function _compileMibs(mibs, scope) {
    // mibs: optional array of raw filenames; scope: 'pending' | 'all' when there is no list.
    _mibCompileAbort = false;
    _mibCompileCancelling = false;
    _mibCompileInProgress = true;
    const btn        = document.getElementById('mibCompileBtn');
    const label      = document.getElementById('mibCompileBtnLabel');
    const stopBtn    = document.getElementById('mibStopBtn');
    const compSelBtn = document.getElementById('mibCompileSelBtn');
    if (btn)        btn.disabled = true;
    if (label)      label.textContent = _ms('mib_compiling', 'Compiling…');
    // Explicit value: CSS hides `.mib-stop` by default, so '' would not show it.
    if (stopBtn)    { stopBtn.style.display = 'inline-block'; stopBtn.disabled = false; }
    if (compSelBtn) compSelBtn.disabled = true;

    try {
        const modName = _mibManagerModuleName;
        const cfg     = modulesData[modName] || {};

        // Start the background compilation job
        const payload = mibs && mibs.length
            ? { ...cfg, mibs }
            : { ...cfg, scope: scope || 'pending' };
        const startRes  = await apiPost(_mibApiUrl(modName, 'compile_mibs_start'), payload);
        const startData = startRes && startRes.data;

        if (!startData || !startData.ok) {
            showToast((startData && startData.message) || (t('error') || 'Error'), 'error');
            return;
        }

        // Immediate completion (empty raw dir)
        if (startData.done) {
            await _mibLoad();
            _mibHandleCompileResult(startData);
            return;
        }

        const jobId = startData.job_id;
        _mibCompileJobId = jobId;
        _mibProgressBegin();
        _mibProgressRender('compiling', 0, startData.total, null, 0);

        // Poll until the job is done.  _mibCompileAbort only fires on modal close.
        let _lastCompleted = -1;
        while (!_mibCompileAbort) {
            await new Promise(r => setTimeout(r, 350));
            if (_mibCompileAbort) break;
            const sRes  = await apiPost(_mibApiUrl(modName, 'compile_mibs_status'), { ...cfg, job_id: jobId });
            const sData = sRes && sRes.data;
            if (_mibCompileAbort) break;  // modal closed while request was in flight
            if (!sData || !sData.ok) {
                showToast((sData && sData.message) || 'Polling error', 'error');
                break;
            }
            // While cancelling, label the bar "Cancelling…" until the job ends.
            const phase = _mibCompileCancelling ? 'cancelling' : (sData.phase || 'compiling');
            const nowCompleted = sData.completed || 0;
            _mibProgressRender(
                phase, nowCompleted,
                // indexing / cancelling have no live count → indeterminate bar.
                (phase === 'indexing' || phase === 'cancelling') ? 0 : (sData.total || startData.total),
                sData.current, 0);
            if (nowCompleted > _lastCompleted) {
                _lastCompleted = nowCompleted;
                _mibRefreshCompiled();  // intentionally not awaited — runs in background
            }
            if (sData.done) {
                _mibProgressHide();
                await _mibLoad();   // refresh first so the breakdown is accurate
                _mibHandleCompileResult(sData);
                break;
            }
        }
    } finally {
        _mibCompileInProgress = false;
        _mibCompileCancelling = false;
        _mibCompileJobId = null;
        _mibProgressHide();
        if (btn)        btn.disabled = false;
        // The MAIN button, so its own label — not the one on the dropdown item beside it.
        // Restoring `mib_compile_all` here renamed 'compile pending' to 'rebuild
        // everything' the first time anybody compiled, and it stayed renamed: two actions
        // with one name, and the surviving name was the slow one.
        if (label)      label.textContent = _ms('mib_compile_pending', 'Compile pending');
        if (stopBtn)    { stopBtn.style.display = 'none'; stopBtn.disabled = false; }
        if (compSelBtn) compSelBtn.disabled = false;
    }
}

async function _importMibFromUrl() {
    const input   = document.getElementById('mibImportUrlInput');
    const btn     = document.getElementById('mibImportUrlBtn');
    const url     = (input?.value || '').trim();
    if (!url) {
        showToast(_ms('mib_import_error_empty', 'Enter a URL to import'), 'error');
        input?.focus();
        return;
    }
    const modName = _mibManagerModuleName;
    const cfg     = modulesData[modName] || {};
    if (btn) btn.disabled = true;
    const res = await apiPost(_mibApiUrl(modName, 'import_mib_from_url'), { ...cfg, url });
    if (btn) btn.disabled = false;
    const d = res && res.data;
    if (d && d.ok) {
        showToast(_ms('mib_import_ok', 'Imported {filename}').replace('{filename}', d.filename));
        if (input) input.value = '';
        // No reload from here: the list is the OTHER view, and it re-reads on the way in.
        // Asking for it from this one is seconds spent on a screen that does not show it.
    } else {
        showToast((d && d.message) || (t('error') || 'Error'), 'error');
    }
}

// ---- GitHub MIB repositories ------------------------------------------------
// Split a config string (newline/comma separated) into a list of dep templates.
function _mibReposList(cfg) {
    return String((cfg && cfg.mib_repos) || '')
        .split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
}

// A repo's dependency templates (a repo lists one template per file extension
// it uses, since repos mix .txt/.my/.mib/extension-less storage).
function _mibRepoTemplates(r) {
    if (Array.isArray(r.dep_templates)) return r.dep_templates.filter(Boolean);
    return r.dep_template ? [r.dep_template] : [];
}

// Recompute the summary badge: number of enabled sources (a fully-active known
// repo counts as one, plus each custom template).
function _mibDepSrcRefreshSummary() {
    const sumEl = document.getElementById('mibDepSrcSummary');
    if (!sumEl) return;
    const known  = (_mibData && _mibData.known_repos) || [];
    const active = new Set(_mibReposList(modulesData[_mibManagerModuleName] || {}));
    const knownTpls = new Set();
    let count = 0;
    for (const r of known) {
        const tpls = _mibRepoTemplates(r);
        tpls.forEach(t => knownTpls.add(t));
        if (tpls.length && tpls.every(t => active.has(t))) count++;
    }
    for (const t of active) if (!knownTpls.has(t)) count++;   // custom sources
    sumEl.innerHTML = `<i class="bi bi-link-45deg me-1"></i>`
        + esc(_ms('mib_dep_src_title', 'Compile dependency sources'))
        + (count ? ` <span class="badge bg-secondary">${count}</span>` : '');
}

// The two dropdowns of the import view: where to import a FOLDER from, and which vendor
// archives there are. Split out of _mibPopulateGithub because the import view has these and
// not the dependency-source list, and because they are all it needs — which is what made a
// cheap answer possible in the first place.
function _mibPopulateImportSources(data) {
    _mibPopulateRepoSelect(data);
    _mibPopulateArchives(data);
}

// Populate the known-repo dropdown and the compile dependency-source toggles
// from the list_mibs payload.  Called on every _mibRender.
function _mibPopulateGithub(data) {
    _mibPopulateRepoSelect(data);
    _mibPopulateArchives(data);
    _mibPopulateDepSources(data);
}

function _mibPopulateRepoSelect(data) {
    const sel = document.getElementById('mibGithubRepoSel');
    const known = (data && data.known_repos) || [];
    if (sel) {
        const cur = sel.value;
        let opts = `<option value="">${esc(_ms('mib_github_custom', 'Custom URL…'))}</option>`;
        for (const r of known) {
            // A source may be an archive only; there is no folder to import from it.
            if (!r.folder) continue;
            opts += `<option value="${escAttr(r.folder)}">${esc(r.name || r.folder)}</option>`;
        }
        sel.innerHTML = opts;
        // Keep the previous selection if it still exists.
        if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
    }

}

// Dependency-source toggles: one checkbox per known repo (toggles ALL of
// its templates at once), plus any custom templates already in the config.
function _mibPopulateDepSources(data) {
    const known = (data && data.known_repos) || [];
    const list = document.getElementById('mibDepSrcList');
    _mibDepSrcRefreshSummary();
    if (!list) return;

    const active = new Set(_mibReposList(modulesData[_mibManagerModuleName] || {}));
    const knownTpls = new Set();
    let rows = '';
    for (const r of known) {
        const tpls = _mibRepoTemplates(r);
        if (!tpls.length) continue;
        tpls.forEach(t => knownTpls.add(t));
        const on = tpls.every(t => active.has(t));
        const id = 'mibDep_' + (r.name || '').replace(/[^a-zA-Z0-9]/g, '_');
        const payload = encodeURIComponent(JSON.stringify(tpls));
        rows += `<div class="form-check">
            <input class="form-check-input" type="checkbox" id="${id}" ${on ? 'checked' : ''}
                   onchange="_mibDepSrcToggle('${payload}', this.checked)">
            <label class="form-check-label small" for="${id}">${esc(r.name || '')}
                <span class="text-muted d-block" style="font-size:.72rem">${esc(tpls[0])}${tpls.length > 1 ? ` (+${tpls.length - 1})` : ''}</span></label>
        </div>`;
    }
    // Custom (non-known) templates already saved — keep them toggleable.
    for (const tpl of active) {
        if (knownTpls.has(tpl)) continue;
        const id = 'mibDep_' + tpl.replace(/[^a-zA-Z0-9]/g, '_');
        const payload = encodeURIComponent(JSON.stringify([tpl]));
        rows += `<div class="form-check">
            <input class="form-check-input" type="checkbox" id="${id}" checked
                   onchange="_mibDepSrcToggle('${payload}', this.checked)">
            <label class="form-check-label small" for="${id}">
                <span class="text-muted">${esc(tpl)}</span></label>
        </div>`;
    }
    list.innerHTML = rows || `<span class="small text-muted">${esc(_ms('mib_dep_src_none', 'No repositories available.'))}</span>`;
}

// ── A vendor's own MIB archive ───────────────────────────────────────────────
// The other half of the known sources: projects publish a folder, vendors publish a file.
// Both end up in the same tree, and both keep the layout they came with.

function _mibPopulateArchives(data) {
    const row = document.getElementById('mibArchiveRow');
    const sel = document.getElementById('mibArchiveSel');
    if (!row || !sel) return;
    const withArchive = ((data && data.known_repos) || []).filter(r => r.archive);
    row.style.display = withArchive.length ? '' : 'none';
    if (!withArchive.length) return;
    const cur = sel.value;
    sel.innerHTML = withArchive.map(r =>
        `<option value="${escAttr(r.name)}">${esc(r.name)}</option>`).join('');
    if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
    const hint = document.getElementById('mibArchiveHint');
    if (hint) hint.textContent = _ms('mib_archive_hint',
        'Compare the vendor archive against what is installed');
}

/** Download the archive and either report what would change, or apply it.
 *
 *  `compare` runs it as a dry run: nothing is written, and every file comes back labelled
 *  against the LAST-UPDATED its author wrote — which is the only thing that says whether the
 *  archive is ahead of what is here. A file's own timestamp says when it was downloaded. */
// A download of tens of megabytes and one disk read per file in the archive, behind a
// single request: the button sat there with nothing to say, which from outside is a button
// that is stuck. It is a background job now — started, polled, collected — and the two things
// it can honestly report are the megabytes and the file count.
let _mibArchiveInProgress = false;
let _mibArchiveLast = null;        // the last comparison, so its rows can show their diff

async function _mibArchiveRun(compare, redownload) {
    const sel = document.getElementById('mibArchiveSel');
    const btn = document.getElementById(compare ? 'mibArchiveCompareBtn' : 'mibArchiveImportBtn');
    if (!sel || !sel.value || _mibArchiveInProgress) return;
    const done = (typeof ssBtnBusy === 'function') ? ssBtnBusy(btn) : (() => {});
    const mod = _mibManagerModuleName;
    _mibArchiveInProgress = true;
    _mibGithubAbort = false;
    _mibProgressBegin();
    _mibProgressRender('downloading', 0, 0, null, 0);
    let d = null;
    try {
        const started = await apiPost(_mibApiUrl(mod, 'import_mib_archive_start'),
                                      {source: sel.value, dry_run: !!compare,
                                       redownload: !!redownload});
        const job = started && started.data;
        if (!job || !job.ok || !job.job_id) {
            d = job;
        } else {
            // Stopping stops the WATCHING, not the job: the download and the comparison run
            // server-side under a job id, and the report is collected by whoever asks next.
            while (!_mibGithubAbort) {
                await new Promise(r => setTimeout(r, 600));
                const st = await apiPost(_mibApiUrl(mod, 'import_mib_archive_status'),
                                         {job_id: job.job_id});
                const sd = st && st.data;
                if (!sd || sd.done || sd.ok === false) { d = sd; break; }
                _mibArchiveProgress(sd);
            }
        }
    } finally {
        _mibArchiveInProgress = false;
        _mibProgressHide();
        done();
    }
    // Asked for again: a job outlives the view it was started from, and the element that was
    // here when it started may be gone.
    const box = document.getElementById('mibArchiveResult');
    if (!box) return;
    // Kept so a row can open its own diff without asking again: the diffs came with the
    // report, computed where both texts were already in hand.
    _mibArchiveLast = d;
    box.style.display = '';
    if (!d || !d.ok) {
        box.innerHTML = `<div class="alert alert-danger py-1 mb-0 small">
            ${esc((d && d.message) || t('error') || 'Error')}</div>`;
        return;
    }
    box.innerHTML = _mibArchiveReport(d);
}

// Why a row was refused. "Rejected" on its own is a word and not an answer, and the three
// reasons want three different things done about them: a MIB too big for the per-file cap is
// a decision somebody can take, a name that cannot be made into a safe path is not.
function _mibArchiveReason(i) {
    if (i.reason === 'too_big') {
        return `<span class="text-muted text-nowrap">${esc(
            _ms('mib_archive_too_big', '{size} — over the {max} per-file limit')
                .replace('{size}', fmtBytes(i.size || 0))
                .replace('{max}', fmtBytes(i.limit || 0)))}</span>`;
    }
    const word = {name: 'mib_archive_bad_name', path: 'mib_archive_bad_name',
                  unreadable: 'mib_archive_unreadable'}[i.reason];
    return word ? `<span class="text-muted text-nowrap">${esc(_ms(word, i.reason))}</span>` : '';
}

// The difference itself, on demand. It travelled with the report — computing it there
// costs nothing, both texts were open — so opening a row asks nobody anything.
async function _mibArchiveShowDiff(n) {
    const box = document.getElementById('mibArchDiff' + n);
    const moved = (((_mibArchiveLast || {}).items) || []).filter(i => i.state !== 'unchanged');
    const row = moved[n];
    if (!box || !row) return;
    if (box.style.display !== 'none') {          // a toggle: closing frees the editor too
        box.style.display = 'none';
        box.innerHTML = '';
        return;
    }
    box.style.display = '';
    _mibSrcEditor = null;
    // A diff when there are two texts; the file itself when there is one and the question is
    // "are you sure this is not a MIB?". Same box, same viewer, different mode.
    await _mibRenderSource(box, row.diff || row.preview || '', 0,
                           row.diff ? 'mibdiff' : 'mib');
}

// What the poll knows: megabytes while it downloads, files while it compares. Rounded to
// whole megabytes because a bar that counts bytes reads as noise.
function _mibArchiveProgress(sd) {
    if (sd.phase === 'downloading') {
        const MB = 1048576;
        const at = Math.round((sd.completed || 0) / MB);
        const of = Math.round((sd.total || 0) / MB);
        // No percentage when there is no total, and for LibreNMS there never is: codeload
        // zips the repository on the fly and answers `Transfer-Encoding: chunked`, so the
        // server does not know the size either. What there is, is megabytes arriving — and a
        // number going up is the whole difference between "working" and "hung". A vendor
        // archive that is a file on a server does send a length, and gets its percentage.
        return _mibProgressRender('downloading', at, of, of ? null : `${at} MiB`, 0, 'MiB');
    }
    _mibProgressRender(sd.phase || 'comparing', sd.completed || 0, sd.total || 0, null, 0);
}

function _mibArchiveStateBadge(state) {
    const map = {
        'new':       ['text-bg-success',   'mib_archive_new',       'new'],
        'updated':   ['text-bg-primary',   'mib_archive_updated',   'updated'],
        // Different content, same LAST-UPDATED. Not an update — the author did not say it
        // was one — and not "unchanged" either, which is the pair of claims the row used to
        // have to choose between.
        'same_version': ['text-bg-info',   'mib_archive_same_version', 'same version'],
        'unchanged': ['text-bg-secondary', 'mib_archive_unchanged', 'unchanged'],
        // Refused on purpose: re-importing an older archive over a MIB somebody fixed by hand
        // is a downgrade whose symptom turns up much later, as an OID that stopped resolving.
        'older':     ['text-bg-warning',   'mib_archive_older',     'older'],
        'rejected':  ['text-bg-danger',    'mib_archive_rejected',  'rejected'],
        // Not refused, just not one: a vendor archive carries its readme and its licence,
        // and calling those 'rejected' reads as a MIB that failed to install.
        'not_a_mib': ['text-bg-secondary', 'mib_archive_not_a_mib', 'not a MIB'],
    };
    const [cls, key, fb] = map[state] || map.rejected;
    return `<span class="badge ${cls} ss-fs-1">${esc(_ms(key, fb))}</span>`;
}

function _mibArchiveReport(d) {
    // Only what changed, and a count for the rest: an archive of twenty files where two moved
    // is a list of two, not a wall of "unchanged" to read past.
    const moved = (d.items || []).filter(i => i.state !== 'unchanged');
    const same = (d.items || []).length - moved.length;
    const rows = moved.map((i, n) => `<div>
        <div class="d-flex align-items-center gap-2 py-1 ss-fs-2">
            ${_mibArchiveStateBadge(i.state)}
            <code class="flex-grow-1 text-truncate">${esc(i.name)}</code>
            ${_mibArchiveReason(i)}
            ${i.installed ? `<span class="text-muted">${esc(i.installed)} →</span>` : ''}
            ${i.version ? `<span class="text-muted">${esc(i.version)}</span>` : ''}
            ${(i.diff || i.preview) ? `<button class="btn btn-sm btn-secondary py-0 ss-fs-2 flex-shrink-0"
                    onclick="_mibArchiveShowDiff(${n})"
                    title="${escAttr(i.diff
                        ? (i.diff_truncated ? _ms('mib_version_diff_big', 'shown in part')
                                            : _ms('mib_dupe_compare', 'Compare'))
                        : _ms('mib_archive_look', 'Look at the file'))}">
                <i class="bi ${i.diff ? 'bi-file-diff' : 'bi-eye'}"></i></button>` : ''}
        </div>
        <div id="mibArchDiff${n}" class="mib-src mib-arch-diff" style="display:none"></div>
    </div>`).join('');
    // Written HERE, from the numbers, and not taken from the server: the server answers in
    // English and this panel is read in whatever language the reader chose. What is NOT in
    // the list goes in the same sentence — "why is this all there is?" is asked at the top,
    // and a line at the foot of a box the height of the screen is a line nobody is reading.
    const bits = [];
    if (d.dry_run) {
        bits.push(_ms('mib_archive_sum_newer', '{n} of {total} MIB(s) newer than installed')
            .replace('{n}', d.changed || 0).replace('{total}', (d.items || []).length));
    } else {
        bits.push(_ms('mib_archive_sum_imported', '{n} MIB file(s) imported')
            .replace('{n}', d.written || 0));
    }
    if (d.same_version) {
        bits.push(_ms('mib_archive_sum_same', '{n} with the same version')
            .replace('{n}', d.same_version));
    }
    if (same) {
        bits.push(_ms('mib_archive_sum_unchanged', '{n} unchanged').replace('{n}', same));
    }
    if (d.cached) bits.push(_ms('mib_archive_sum_cached', 'from the copy already downloaded'));
    const head = esc(bits.join(' — '));
    const tail = '';
    // The header and the count stay put; only the list scrolls — and it scrolls at the
    // height of the PAGE, which is the reason the import stopped being a dialog: comparing
    // against LibreNMS answers four thousand rows, and a box capped at 14rem shows nine of
    // them. `.ss-vfill` down to one `.ss-vscroll`, the same chain the MIB list uses.
    return `<div class="border rounded p-2 ss-vfill" style="background:var(--bs-body-bg)">
        <div class="small fw-semibold mb-1 flex-shrink-0">${head}${tail}</div>
        ${rows ? `<div class="ss-vscroll">${rows}</div>` : ''}</div>`;
}

// When a known repo is picked, prefill the folder URL field.
function _mibGithubRepoPick() {
    const sel = document.getElementById('mibGithubRepoSel');
    const inp = document.getElementById('mibGithubUrlInput');
    if (sel && inp && sel.value) inp.value = sel.value;
}

// Add/remove a group of dependency-source templates in the module config
// (persisted on save).  tplsEnc = encodeURIComponent(JSON.stringify([...])).
function _mibDepSrcToggle(tplsEnc, on) {
    let tpls;
    try { tpls = JSON.parse(decodeURIComponent(tplsEnc)); } catch { return; }
    if (!Array.isArray(tpls)) return;
    const modName = _mibManagerModuleName;
    if (!modName) return;
    const cfg = modulesData[modName] || (modulesData[modName] = {});
    const set = new Set(_mibReposList(cfg));
    for (const t of tpls) { if (on) set.add(t); else set.delete(t); }
    cfg.mib_repos = Array.from(set).join('\n');
    markDirty('modules');
    _mibDepSrcRefreshSummary();
}

// Import every MIB file from a GitHub folder URL into the raw directory.
async function _importMibFromGithub() {
    const input = document.getElementById('mibGithubUrlInput');
    const btn   = document.getElementById('mibGithubImportBtn');
    const rec   = document.getElementById('mibGithubRecursive');
    const url   = (input?.value || '').trim();
    if (!url) {
        showToast(_ms('mib_github_error_empty', 'Pick a repository or enter a GitHub folder URL'), 'error');
        input?.focus();
        return;
    }
    const modName = _mibManagerModuleName;
    const cfg     = modulesData[modName] || {};
    const icon  = document.getElementById('mibGithubImportIcon');
    const label = document.getElementById('mibGithubImportBtnLabel');
    const _prevLabel = label ? label.textContent : '';
    _mibGithubAbort = false;
    _mibGithubInProgress = true;
    if (btn) btn.disabled = true;
    if (icon) icon.className = 'spinner-border spinner-border-sm me-1';
    if (label) label.textContent = _ms('mib_github_importing', 'Importing…');

    try {
        // Start the background import job.
        const startRes  = await apiPost(_mibApiUrl(modName, 'import_mib_from_github_start'),
                                        { ...cfg, url, recursive: !!(rec && rec.checked) });
        const startData = startRes && startRes.data;
        if (!startData || !startData.ok) {
            showToast((startData && startData.message) || (t('error') || 'Error'), 'error');
            return;
        }
        const jobId = startData.job_id;

        // Phase-labelled progress + Stop button.  Total is unknown until the
        // server finishes discovery, so the bar is indeterminate until then.
        _mibProgressBegin();
        _mibProgressRender('discovering', 0, 0, null, 0);
        let sData = null;
        while (!_mibGithubAbort) {
            await new Promise(r => setTimeout(r, 350));
            if (_mibGithubAbort) break;
            const sRes = await apiPost(_mibApiUrl(modName, 'import_mib_from_github_status'),
                                       { ...cfg, job_id: jobId });
            sData = sRes && sRes.data;
            if (_mibGithubAbort) break;
            if (!sData || !sData.ok) {
                showToast((sData && sData.message) || 'Polling error', 'error');
                break;
            }
            const total = sData.total || 0;
            _mibProgressRender(total ? 'downloading' : 'discovering',
                               sData.imported || 0, total, sData.current, sData.failed || 0);
            if (sData.done) break;
        }
        if (sData && sData.done) {
            let msg = (sData.message || _ms('mib_github_import_ok', 'Imported {n} file(s)'))
                      .replace('{n}', sData.imported || 0);
            if (sData.failed) {
                const names = sData.failed_names || [];
                const shown = names.slice(0, 8).join(', ');
                const more  = names.length - 8;
                msg += ' — ' + _ms('mib_github_n_failed', '{f} failed').replace('{f}', sData.failed)
                     + (shown ? ': ' + shown + (more > 0 ? `, +${more}` : '') : '');
            }
            showToast(msg, sData.failed ? 'warning' : undefined);
            // An import that wrote over a MIB somebody had corrected says so. The import
            // still wins — a newer vendor MIB is usually the point — but a fix that vanishes
            // without a word is one you find out about the next time the same compile error
            // comes back, three weeks later, having forgotten you ever fixed it.
            const over = sData.replaced_edited || [];
            if (over.length) {
                showToast(
                    _ms('mib_import_replaced_edits',
                        'Your edits to {names} were replaced — the previous content is '
                        + 'kept as a version')
                        .replace('{names}', over.slice(0, 6).join(', ')
                                 + (over.length > 6 ? `, +${over.length - 6}` : '')),
                    'warning');
            }
        }
    } finally {
        _mibGithubInProgress = false;
        _mibProgressHide();
        if (btn) btn.disabled = false;
        if (icon) icon.className = 'bi bi-github me-1';
        if (label) label.textContent = _prevLabel || _ms('mib_github_import_btn', 'Import folder');
    }
}

async function _uploadMibFiles(files) {
    if (!files || !files.length) return;
    const modName = _mibManagerModuleName;
    const label = document.getElementById('mibUploadLabel');
    if (label) label.style.opacity = '.6';

    // MIB files are plain ASCII/UTF-8 text — send content via standard JSON action.
    const modCfg = modulesData[modName] || {};
    let uploaded = 0;
    const errors = [];
    for (const file of Array.from(files)) {
        try {
            const content = await file.text();
            const res = await apiPost(_mibApiUrl(modName, 'upload_mib'), {
                ...modCfg,
                filename: file.name,
                content,
            });
            const d = res && res.data;
            if (d && d.ok) { uploaded++; }
            else { errors.push(file.name + ': ' + ((d && d.message) || 'Error')); }
        } catch (e) {
            errors.push(file.name + ': ' + e.message);
        }
    }
    if (label) label.style.opacity = '';
    const fi = document.getElementById('mibFileInput');
    if (fi) fi.value = '';

    if (uploaded) showToast(_ms('mib_uploaded', '{n} file(s) uploaded').replace('{n}', uploaded));
    for (const e of errors) showToast(e, 'error');
    await _mibLoad();
}
