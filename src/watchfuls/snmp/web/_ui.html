{# ================================================================
   SNMP MIB Manager — upload, list and compile MIB files.
   Injected into the dashboard's <script> block by the generic
   module-web-UI include mechanism in _js_modules.html.
   All user-visible strings are read from this module's own ui
   i18n block via _modUiStr() — no SNMP strings in web_admin.
   ================================================================ #}

// ──────────────────────────── MIB Manager ─────────────────────────
let _mibManagerModuleName = null;
let _mibData = null;    // last loaded data — kept for live filtering
let _mibCompileAbort = false;       // set to true to cancel the polling loop
let _mibCompileInProgress = false;  // true while a compile job is running (a Refresh
                                    // mid-compile must not re-enable the Compile button)
let _mibGithubAbort = false;        // set to true to cancel the GitHub import poll loop
let _mibGithubInProgress = false;   // true while a GitHub import job is running
let _mibCompileJobId = null;        // active compile job id (for server-side cancel)
let _mibCompileCancelling = false;  // true after Stop is pressed, until the job ends
let _mibRawModules = new Set();     // modules the raw files declare — to tag compiled deps
let _mibSelection = new Set();      // selected MODULE names — a row is a module, not a file
let _mibFilter = 'all';             // active state chip: all | pending | compiled | dep
let _mibFolder = '';                // active folder ('' = every one of them)
let _mibOpenGroups = new Set();     // folder groups the user has opened by hand

// Below this many rows the grouping is pure overhead: everything is expanded and the list
// behaves exactly as it did when a MIB tree meant twenty files. The point of the headers is
// a repository import that brings two thousand, where a flat list is unreadable however fast
// it draws.
const _MIB_AUTO_EXPAND = 60;
// The group a dependency goes in. It has no folder — pysmi pulled it in resolving an IMPORTS
// and it came from nowhere in the tree — and leaving it in the root group would put files
// nobody chose among the ones somebody did. A key no folder can have, so it sorts last.
const _MIB_DEP_GROUP = '\u0000deps';
const _MIB_STRAY_GROUP = '\u0000stray';
// Why each MIB refused to compile lives WITH the MIBs, not in this page: a compile of two
// hundred is not something anyone watches to the end, and the failures are what you come back
// for — after the modal closed, after a reload, tomorrow. list_mibs answers with them.
let _mibRefreshingCompiled = false; // guard: prevents concurrent list_mibs during polling
let _mibDetailsData = null;         // {type:'compiled'|'raw', rows:[...]} for sortable viewer
let _mibDetailsSort = {col: null, asc: true};

// ── MIB details viewer: shared badge + sort helpers ───────────────
function _mibStatusBadge(s) {
    if (!s) return '';
    const cls = s === 'current' ? 'bg-success' : s === 'deprecated' ? 'bg-warning text-dark' : 'bg-secondary';
    return `<span class="badge ${cls} ms-1" style="font-size:.60rem">${esc(s)}</span>`;
}
function _mibAccessBadge(a) {
    if (!a) return '';
    const cls = a.includes('write') || a.includes('create') ? 'bg-primary' : 'bg-secondary';
    return `<span class="badge ${cls}" style="font-size:.60rem">${esc(a)}</span>`;
}
function _mibKindBadge(k) {
    const cls = k === 'OBJECT-TYPE' ? 'bg-primary'
              : k === 'NOTIFICATION-TYPE' ? 'bg-warning text-dark'
              : k === 'TEXTUAL-CONVENTION' ? 'bg-info text-dark' : 'bg-secondary';
    return `<span class="badge ${cls}" style="font-size:.60rem">${esc(k)}</span>`;
}
function _mibOidCmp(a, b) {
    const pa = (a || '').split('.').map(Number);
    const pb = (b || '').split('.').map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
        const d = (pa[i] ?? -1) - (pb[i] ?? -1);
        if (d !== 0) return d;
    }
    return 0;
}
function _mibSortDetails(col) {
    if (_mibDetailsSort.col === col) {
        _mibDetailsSort.asc = !_mibDetailsSort.asc;
    } else {
        _mibDetailsSort.col = col;
        _mibDetailsSort.asc = true;
    }
    _mibRenderDetailsTbody();
}
function _mibRenderDetailsTbody() {
    const tbody = document.getElementById('mibDetailsTbody');
    const thead = document.getElementById('mibDetailsThead');
    if (!tbody || !_mibDetailsData) return;
    const {type, rows} = _mibDetailsData;
    const {col, asc}   = _mibDetailsSort;
    let sorted = [...rows];
    if (col !== null) {
        sorted.sort((a, b) => {
            let cmp;
            if (type === 'compiled') {
                if (col === 1) {
                    cmp = _mibOidCmp(a.oid, b.oid);
                } else {
                    const vA = ([a.name, a.oid, a.type, a.units||'', a.access||''][col] || '');
                    const vB = ([b.name, b.oid, b.type, b.units||'', b.access||''][col] || '');
                    cmp = vA.localeCompare(vB, undefined, {sensitivity: 'base', numeric: true});
                }
            } else {
                const vA = ([a.name, a.syntax||'', a.units||'', a.access||''][col] || '');
                const vB = ([b.name, b.syntax||'', b.units||'', b.access||''][col] || '');
                cmp = vA.localeCompare(vB, undefined, {sensitivity: 'base', numeric: true});
            }
            return asc ? cmp : -cmp;
        });
    }
    if (type === 'compiled') {
        tbody.innerHTML = sorted.map(s => `<tr>
            <td style="min-width:10rem">
                <div class="fw-semibold text-nowrap">${esc(s.name)}${_mibStatusBadge(s.status)}</div>
                ${s.desc ? `<div class="text-muted" style="font-size:.70rem;white-space:normal;max-width:26rem">${esc(s.desc)}</div>` : ''}
            </td>
            <td class="font-monospace text-muted text-nowrap" style="font-size:.70rem">${esc(s.oid)}</td>
            <td class="text-nowrap text-secondary">${esc(s.type)}</td>
            <td class="text-nowrap text-muted" style="font-size:.72rem">${s.units ? esc(s.units) : ''}</td>
            <td class="text-nowrap">${_mibAccessBadge(s.access)}</td>
        </tr>`).join('');
    } else {
        tbody.innerHTML = sorted.map(o => `<tr>
            <td style="min-width:11rem">
                <div class="fw-semibold text-nowrap">${esc(o.name)}${_mibStatusBadge(o.status||'')}</div>
                <div>${_mibKindBadge(o.kind)}</div>
                ${o.desc ? `<div class="text-muted mt-1" style="font-size:.70rem;white-space:pre-wrap;max-width:28rem">${esc(o.desc)}</div>` : ''}
            </td>
            <td class="font-monospace text-secondary" style="font-size:.72rem;white-space:pre-wrap">${esc(o.syntax || '')}</td>
            <td class="text-nowrap text-muted" style="font-size:.72rem">${o.units ? esc(o.units) : ''}</td>
            <td class="text-nowrap text-secondary" style="font-size:.72rem">${esc(o.access || '')}</td>
        </tr>`).join('');
    }
    if (thead) {
        thead.querySelectorAll('th').forEach((th, i) => {
            const icon = th.querySelector('.mib-sort-icon');
            if (!icon) return;
            icon.className = `mib-sort-icon bi ms-1 ${col === i
                ? (asc ? 'bi-sort-up' : 'bi-sort-down')
                : 'bi-sort opacity-25'}`;
        });
    }
}

// Shorthand: read a ui string from the active module's own lang file.
function _ms(key, fallback) {
    return _modUiStr(_mibManagerModuleName, key, fallback);
}

// Build a watchful action URL using the API version declared in the
// module's own __module__ schema entry (api_ver), defaulting to 'v1'.
function _mibApiUrl(modName, action) {
    const ver = (ITEM_SCHEMAS[`${modName}|__module__`] || {})['api_ver'] || 'v1';
    return `/api/${ver}/modules/watchfuls/${modName}/${action}`;
}

// ── Module-level rendering helpers ────────────────────────────────
function _mibSz(n) {
    return n < 1024 ? n + ' B'
         : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
         : (n / 1048576).toFixed(1) + ' MB';
}

// A compiled .py is a *dependency* (auto-pulled by pysmi) when no raw file here DECLARES
// it. Compared against file names instead, every MIB whose file is not named after its module
// looked like something pysmi had gone and fetched by itself.
function _mibIsDependency(name) {
    return _mibRawModules.size > 0 && !_mibRawModules.has(name.replace(/\.py$/, ''));
}

// Break the compiled set into {requested, deps, total} for the post-compile toast.
function _mibCompiledBreakdown() {
    const compiled = (_mibData && _mibData.compiled) || [];
    let deps = 0;
    for (const f of compiled) if (_mibIsDependency(f.name)) deps++;
    return { total: compiled.length, deps, requested: compiled.length - deps };
}

// ── The list model ────────────────────────────────────────────────
// The API answers two lists of FILES — `raw` (.mib/.txt, with the folder it was imported
// into) and `compiled` (.py).  They are the same MIB seen twice: SYNOLOGY-DISK-MIB.txt on
// one side and SYNOLOGY-DISK-MIB.py on the other, and answering "is this compiled?" meant
// reading both and comparing by eye.  So the list is keyed by what pysmi itself is keyed by
// — the MODULE name — and the file pair becomes a state on one row.
//
// Two raw files can share a module name (two vendors each shipping SNMPv2-SMI): that is ONE
// module to compile, which is why `raws` is a list and not a path.
function _mibRows() {
    if (!_mibData) return [];
    const _stem = n => n.replace(/\.[^./]+$/, '');
    const rows  = new Map();
    for (const f of (_mibData.raw || [])) {
        const parts = String(f.name).split('/');
        const file  = parts.pop();
        // Keyed by the MODULE the file declares, not by the file's name. They are routinely
        // different — `trunk.mib` is IEEE8023-LAG-MIB, `rfc2011.mib` is IP-MIB — and pysmi
        // knows only the module: it writes `<MODULE>.py` and resolves every IMPORTS by it.
        // Keyed by the file name, such a MIB compiles perfectly and shows as pending for
        // ever, because the row is looking for a `.py` that will never be written.
        const mib = f.module || _stem(file);
        let r = rows.get(mib);
        if (!r) { r = {mib, dir: parts.join('/'), raws: [], files: [], py: null, size: 0};
                  rows.set(mib, r); }
        r.raws.push(f.name);
        r.files.push(file);
        r.rawMtime = Math.max(r.rawMtime || 0, f.mtime || 0);
        if (f.size > r.size) r.size = f.size;
    }
    for (const f of (_mibData.compiled || [])) {
        // A .py IS its module name — that is how pysmi writes them — so this side needs no
        // translation and never did. The raw side was the one speaking a different language.
        const mib = _stem(f.name);
        let r = rows.get(mib);
        if (!r) { r = {mib, dir: '', raws: [], files: [], py: null, size: 0}; rows.set(mib, r); }
        r.py = f.name;
        r.pyMtime = f.mtime || 0;
        r.pySource = f.source || '';   // the raw file it was built from, per pysmi
        if (!r.raws.length) r.size = f.size;   // a dependency has no source to size
    }
    // History with no file behind it. It is kept on purpose — deleting a MIB to re-import it
    // clean is the ordinary way out of a mess — but kept and never drawn is a thing that
    // exists and cannot be reached: no row, no way back, no way to clear it out.
    for (const [mib, version] of Object.entries(_mibData.orphans || {})) {
        if (!rows.has(mib)) {
            rows.set(mib, {mib, dir: '', raws: [], files: [], py: null, size: 0,
                           rawMtime: 0, pyMtime: 0, orphanVersion: version});
        }
    }

    const out = [];
    const errs   = (_mibData.errors || {});
    const edited = (_mibData.edited || {});
    for (const r of rows.values()) {
        r.key = (r.dir ? r.dir + '/' : '') + r.mib;
        // The file it came from, when that is not what the module is called. Shown, because
        // a row that says IEEE8023-LAG-MIB while the folder holds `trunk.mib` is a row nobody
        // can match to a file — and matching them is most of what this screen is for.
        r.file = (r.files.length === 1 && _stem(r.files[0]) !== r.mib) ? r.files[0] : '';
        // A recorded failure is its OWN state, not a flavour of pending: "pending" is also
        // what a MIB nobody has compiled yet says, and the two need opposite things done to
        // them — one a click, the other a file that is not broken.  Given a chip of its own,
        // "what failed" is one click away after a run of two hundred.
        const e = errs[r.mib];
        r.error = (e && e.error) || '';
        r.errorAt = (e && e.at) || 0;
        // The version the file is AT. Absent means nobody has edited it, so it is still the
        // vendor's own — which is why an untouched MIB wears no badge rather than a "v1":
        // a number on every row would make the one that matters invisible.
        r.version = edited[r.mib] || 0;
        // Several files carrying this module name — pysmi reads ONE of them and says nothing
        // about the rest, so which one, and whether they even differ, is the row's business.
        r.dupe = (_mibData.dupes || {})[r.mib] || null;
        // Stale is a STATE, not a footnote on 'compiled'. As a flag it sat inside the
        // compiled count, so the chips said "Pending 0, Compiled 97" while the compile button
        // set off to do three files — the row and the button disagreeing about the same
        // question. The chips partition the list now, and pending + stale + failed is exactly
        // what "compile pending" walks.
        // MACRO DEFINITIONS and nothing else — RFC-1212 and RFC-1215. No .py is produced
        // for them and none is missing: pysnmp has them built in, and there is nothing in
        // them to compile. Left as "pending" the row is a number that never goes down.
        r.state = (_mibData.macro_only || []).includes(r.mib) && r.raws.length ? 'builtin'
                : r.orphanVersion ? 'orphan'
                // A .py with no source. WHICH kind is the difference between junk and the
                // only copy of something: pysmi wrote into it where it read from, and a path
                // under `raw/` that is not there any more is a compilation that outlived the
                // file it was made from — deleting a folder is exactly how that happens, and
                // nothing in `compiled/` says which folder anything came from. No path at all
                // means pysmi resolved it elsewhere (its own bundled MIBs, or over HTTP):
                // that one is a dependency, it cannot be rebuilt, and the modules importing
                // it stop loading the day it goes.
                : !r.raws.length ? (r.pySource ? 'stray' : 'dep')
                : !r.py          ? (r.error ? 'failed' : 'pending')
                : r.rawMtime > r.pyMtime ? 'stale'
                :                  'compiled';
        // A compiled module whose SOURCE is gone. Nothing about it is newer than anything —
        // the file it was made from was deleted, so no timestamp can say so — and left alone
        // the row reads "compiled" while what is compiled came from a file nobody can open
        // any more. Deleting one copy of a duplicated module is exactly how this happens.
        if (r.state === 'compiled' && r.pySource && r.raws.length
                && !r.raws.some(p => p.toLowerCase() === r.pySource.toLowerCase())) {
            r.state = 'stale';
            r.staleGone = true;
        }
        // AFTER the state, which is what decides it: a dependency has no folder of its own.
        r.group = r.state === 'dep'   ? _MIB_DEP_GROUP
                : r.state === 'stray' ? _MIB_STRAY_GROUP
                :                       (r.dir || '');
        out.push(r);
    }
    // Dependencies last: pysmi pulled them in, nobody asked for them.
    const _last = r => r.state === 'dep' ? 2 : r.state === 'stray' ? 1 : 0;
    out.sort((a, b) => _last(a) - _last(b)
                    || a.key.toLowerCase().localeCompare(b.key.toLowerCase()));
    return out;
}

function _mibCounts(rows) {
    const c = {all: rows.length, pending: 0, stale: 0, compiled: 0, failed: 0, dep: 0,
               orphan: 0, builtin: 0, stray: 0, dupe: 0, dupediff: 0};
    for (const r of rows) {
        c[r.state]++;
        // Cross-cutting, not a state: a duplicated module is still compiled, or pending, or
        // failed. It is counted apart because "which of these is the one being used" is a
        // question about the file and not about the compilation.
        if (r.dupe) { c.dupe++; if (!r.dupe.same) c.dupediff++; }
    }
    return c;
}

// The rows the user can actually see: state chip first, then the search box.
function _mibVisibleRows() {
    const q    = (document.getElementById('mibSearch')?.value || '').toLowerCase();
    let rows = _mibRows().filter(r => _mibFilter === 'all' ? true
                                    : _mibFilter === 'dupe' ? !!r.dupe
                                    : r.state === _mibFilter);
    if (_mibFolder) rows = rows.filter(r => r.group === _mibFolder);
    return q ? rows.filter(r => r.key.toLowerCase().includes(q)) : rows;
}

// Every file a row stands for — what a delete actually removes. A row is a MODULE and
// stands for two different things: the source somebody wrote and the .py pysmi produced from
// it. *scope* picks one of them; without it, both.
function _mibArtifacts(rows, scope) {
    const out = [];
    for (const r of rows) {
        if (scope !== 'compiled') for (const p of r.raws) out.push({name: p, kind: 'raw'});
        if (scope !== 'raw' && r.py) out.push({name: r.py, kind: 'compiled'});
    }
    return out;
}

function _mibStateBadge(r) {
    const state = r.state;
    // A parser message is a sentence with an offset in it — too long for a row and too
    // important to truncate, so the badge opens it.
    if (r.error) return `<button type="button"
            class="badge bg-danger flex-shrink-0 border-0"
            style="font-size:.6rem;cursor:pointer"
            onclick="_mibShowError(${jsStr(r.mib)})"
            title="${escAttr(r.error)}">${esc(_ms('mib_state_failed', 'error'))}</button>`;
    if (state === 'builtin') return `<span class="badge bg-secondary flex-shrink-0"
             style="font-size:.6rem"
             title="${escAttr(_ms('mib_builtin_tooltip', 'Macro definitions only — pysnmp has this one built in, and there is nothing in it to compile'))}">${esc(_ms('mib_builtin', 'built in'))}</span>`;
    if (state === 'orphan') return `<span class="badge bg-info text-dark flex-shrink-0"
             style="font-size:.6rem"
             title="${escAttr(_ms('mib_orphan_tooltip', 'The file is gone; only its history is left'))}">${esc(_ms('mib_orphan', 'history only'))}</span>`;
    if (state === 'stale') return `<span class="badge bg-warning text-dark flex-shrink-0"
             style="font-size:.6rem"
             title="${escAttr(r.staleGone
                 ? _ms('mib_stale_gone_tooltip', 'Compiled from a file that is no longer here — compile it again to use the one that is')
                 : _ms('mib_stale_tooltip', 'The source is newer than the compiled module — compile it again'))}">${esc(_ms('mib_stale', 'outdated'))}</span>`;
    if (state === 'stray') return `<span class="badge bg-danger flex-shrink-0"
             style="font-size:.6rem"
             title="${escAttr(_ms('mib_stray_tooltip', 'Compiled from a file that is no longer in the library — it cannot be compiled again')
                        + (r.pySource ? `: ${r.pySource}` : ''))}">${esc(_ms('mib_stray', 'no source'))}</span>`;
    if (state === 'compiled') return `<span class="badge bg-success flex-shrink-0" style="font-size:.6rem">${esc(_ms('mib_state_compiled', 'compiled'))}</span>`;
    if (state === 'pending')  return `<span class="badge bg-warning text-dark flex-shrink-0" style="font-size:.6rem">${esc(_ms('mib_state_pending', 'pending'))}</span>`;
    return `<span class="badge bg-secondary flex-shrink-0" style="font-size:.6rem"
                  title="${escAttr(_ms('mib_dep_tooltip', 'Dependency pulled in automatically'))}">${esc(_ms('mib_dep_badge', 'dep'))}</span>`;
}

// ── Several files, one module name ────────────────────────────────
//
// pysmi resolves an imported module BY NAME: of several files called SNMPv2-TC it reads
// exactly one and never mentions the others. Vendor archives ship their own copy of the
// standard MIBs, so this happens by itself — and a stripped copy winning over the real one
// breaks the MIBs that import it, three modules away from where anybody would look. What
// decides it today is the order of a directory walk, which is to say the alphabet.
let _mibDupMib = '';

// Opened, then asked. Which modules collide comes with the listing — it is a grouping of
// what the listing already knows — but what is IN each copy is read from disk, and reading
// 529 files to fill panels nobody had opened was four minutes on every load of the section.
// So the answer is fetched here, once per group, and kept on the group.
async function _mibDupesShow(mib) {
    const d = (_mibData && _mibData.dupes && _mibData.dupes[mib]) || null;
    if (!d) return;
    _mibDupMib = mib;
    const titleEl = document.getElementById('mibDetailsTitle');
    const bodyEl  = document.getElementById('mibDetailsBody');
    if (titleEl) titleEl.textContent = mib;
    // Shown before the answer arrives: hashing a handful of files is quick, and a dialog
    // that opens when it is ready is a button that did nothing.
    if (bodyEl && !d._detailed) {
        bodyEl.innerHTML = `<div class="text-center py-4">
            <div class="spinner-border spinner-border-sm"></div></div>`;
    }
    bootstrap.Modal.getOrCreateInstance(document.getElementById('mibDetailsModal')).show();
    if (!d._detailed) {
        const modName = _mibManagerModuleName;
        const res = await apiPost(_mibApiUrl(modName, 'mib_dupe_details'),
                                  { ...(modulesData[modName] || {}), mib,
                                    names: d.files.map(f => f.name) });
        const det = res && res.data;
        if (!det || !det.ok) {
            if (bodyEl) bodyEl.innerHTML = `<div class="text-danger text-center py-3 small">
                ${esc((det && det.message) || t('error') || 'Error')}</div>`;
            return;
        }
        d.same = det.same;
        d.kinship = det.kinship;
        d.files.forEach(f => { f.sha = (det.sha || {})[f.name] || ''; });
        d._detailed = true;
    }
    if (bodyEl) bodyEl.innerHTML = _mibDupesHtml(mib, d);
    _mibSrcEditor = null;
    // Different content is the case that needs looking at, so it opens looking at it: the
    // copy in use against the first one that is not the same as it. Unless they are not
    // versions of each other at all, where a diff is a full rewrite and says nothing.
    if (!d.same && d.kinship !== 0) {
        const a = d.used || d.files[0].name;
        const other = d.files.find(f => f.name !== a
                                   && f.sha !== (d.files.find(x => x.name === a) || {}).sha);
        if (other) _mibDupDiff(a, other.name);
    }
}

function _mibDupesHtml(mib, d) {
    const same = d.same;
    const badge = same
        ? `<span class="badge bg-success">${esc(_ms('mib_dupe_same', 'Same content'))}</span>`
        : `<span class="badge bg-warning text-dark">${esc(_ms('mib_dupe_diff', 'Different content'))}</span>`;
    const opts = d.files.map(f =>
        `<option value="${escAttr(f.name)}">${esc(f.name)}</option>`).join('');
    // Do these files even declare the same things? Copies of one module share their
    // descriptors whatever changed between vintages; two MIBs that merely share a first line
    // share none, and telling somebody to pick which one stays would cost them everything the
    // other one declares. A vendor archive produces this by copy-pasting a header.
    const _strangers = d.kinship === 0;
    const _partial = d.kinship > 0 && d.kinship < 90;
    // The date the MIBs declare for themselves, when any of them does. It is the thing that
    // actually decides which copy stays — the diff shows it too, twenty lines in, and having
    // to read a diff to find out which of two files is the older one is the long way round.
    // Absent from a quarter of them (SNMPv2-TC carries textual conventions and no
    // MODULE-IDENTITY at all), so the column only exists when there is something in it.
    const _dates = d.files.map(f => f.updated || '');
    const _hasDates = _dates.some(Boolean);
    const _newest = _hasDates && new Set(_dates.filter(Boolean)).size > 1
        ? _dates.slice().sort().pop() : '';
    return `<div class="d-flex align-items-center gap-2 mb-2 p-2 rounded flex-shrink-0"
                 style="background:var(--bs-secondary-bg);font-size:.82rem">
        <i class="bi ${_strangers ? 'bi-exclamation-octagon text-danger' : 'bi-files text-warning'} flex-shrink-0"></i>
        <span>${esc(_ms('mib_dupe_head', '{n} files carry the module {name} — only one is compiled')
                    .replace('{n}', d.files.length).replace('{name}', mib))}</span>
        <span class="ms-auto">${badge}</span>
    </div>
    <div class="table-responsive flex-shrink-0 mb-2">
    <table class="table table-sm table-hover align-middle mb-0" style="font-size:.78rem">
        <tbody>${d.files.map(f => _mibDupRow(f, d, _hasDates, _newest)).join('')}</tbody>
    </table>
    </div>
    ${_strangers ? `<div class="alert alert-warning py-2 px-2 mb-2 flex-shrink-0"
         style="font-size:.8rem">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span class="fw-semibold">${esc(_ms('mib_dupe_strangers', 'These are not copies of one MIB.'))}</span>
        ${esc(_ms('mib_dupe_strangers_hint',
            'They declare nothing in common — they are different MIBs whose first line says the '
            + 'same module name, which is what a vendor archive does by copy-pasting a header. '
            + 'Deleting one would lose everything it declares: correct the module name on line 1 '
            + 'of the ones that are wrong instead.'))}
    </div>` : ''}
    ${_partial ? `<div class="small text-muted flex-shrink-0 mb-2">
        <i class="bi bi-info-circle me-1"></i>${esc(_ms('mib_dupe_partial',
            'They share {n}% of what they declare — far apart for two versions of one MIB.')
            .replace('{n}', d.kinship))}
    </div>` : ''}
    ${same ? `<div class="small text-muted flex-shrink-0">
        <i class="bi bi-info-circle me-1"></i>${esc(_ms('mib_dupe_same_hint',
            'The copies are identical, so which one is used makes no difference — deleting the spares only tidies the listing.'))}
    </div>` : `
    <div class="d-flex align-items-center gap-2 flex-wrap mb-2 flex-shrink-0">
        <select class="form-select form-select-sm" style="width:auto" id="mibDupA">${opts}</select>
        <i class="bi bi-arrow-right text-muted"></i>
        <select class="form-select form-select-sm" style="width:auto" id="mibDupB">${opts}</select>
        <button class="btn btn-sm btn-secondary" onclick="_mibDupDiffPicked()">
            <i class="bi bi-file-diff me-1"></i>${esc(_ms('mib_dupe_compare', 'Compare'))}</button>
        <span id="mibDupDiffNote" class="small text-muted"></span>
    </div>
    <div class="mib-src ss-vfill" id="mibDupDiffBox"></div>`}`;
}

function _mibDupRow(f, d, hasDates, newest) {
    const inUse = f.name === d.used;
    // A file with no date among files that have one is not a blank cell: it is a MIB that
    // does not say, and saying so is what stops it being read as "older".
    const _date = hasDates ? `<td class="text-nowrap ${f.updated ? '' : 'text-muted'}"
            style="font-size:.72rem"
            title="${escAttr(f.updated
                ? _ms('mib_dupe_updated_tooltip', 'The date the MIB declares for itself (LAST-UPDATED)')
                : _ms('mib_dupe_no_updated', 'This MIB declares no LAST-UPDATED'))}">${esc(f.updated || '—')}${
        f.updated && f.updated === newest
            ? ` <span class="badge bg-success" style="font-size:.6rem">${esc(_ms('mib_dupe_newest', 'newest'))}</span>`
            : ''}</td>` : '';
    return `<tr>
        <td class="text-nowrap">${inUse
            ? `<span class="badge bg-primary" title="${escAttr(_ms('mib_dupe_used_tooltip',
                  'The one pysmi reads for this module'))}">${esc(_ms('mib_dupe_used', 'in use'))}</span>`
            : ''}</td>
        <td class="w-100 text-break">${esc(f.name)}</td>
        <td class="text-nowrap text-muted">${_mibSz(f.size)}</td>
        ${_date}
        <td class="text-nowrap text-muted"><code style="font-size:.72rem">${esc(f.sha)}</code></td>
        <td class="text-nowrap">
            <button class="btn btn-sm btn-secondary py-0 px-1"
                    title="${escAttr(_ms('mib_view_raw', 'View source file'))}"
                    onclick="_mibShowRawDetails(${jsStr(f.name)})">
                <i class="bi bi-eye" style="font-size:.75rem"></i></button>
            <button class="btn btn-sm btn-danger py-0 px-1"
                    title="${escAttr(t('delete') || 'Delete')}"
                    onclick="_mibDupDelete(${jsStr(f.name)},${inUse})">
                <i class="bi bi-trash3" style="font-size:.75rem"></i></button>
        </td>
    </tr>`;
}

function _mibDupDiffPicked() {
    const a = document.getElementById('mibDupA');
    const b = document.getElementById('mibDupB');
    if (a && b) _mibDupDiff(a.value, b.value);
}

async function _mibDupDiff(a, b) {
    const selA = document.getElementById('mibDupA');
    const selB = document.getElementById('mibDupB');
    if (selA) selA.value = a;
    if (selB) selB.value = b;
    const note = document.getElementById('mibDupDiffNote');
    const box  = document.getElementById('mibDupDiffBox');
    if (!box) return;
    if (a === b) {
        if (note) note.textContent = _ms('mib_dupe_pick_two', 'Pick two different files');
        return;
    }
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'diff_mib_files'),
                              { ...(modulesData[modName] || {}), a, b });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    if (note) {
        note.textContent = d.identical
            ? _ms('mib_dupe_identical', 'These two are identical')
            : (d.truncated ? _ms('mib_version_diff_big', 'shown in part') : '');
    }
    _mibSrcEditor = null;
    await _mibRenderSource(box, d.diff || '', 0, 'mibdiff');
}

// Deleting one copy — the file, and nothing else. The history belongs to the MODULE and
// survives whichever copy goes, so it is not offered here the way it is on the row.
function _mibDupDelete(name, inUse) {
    const msg = inUse
        ? _ms('mib_dupe_delete_used_confirm',
              'Delete {name}? It is the copy being compiled — another one takes its place.')
        : _ms('mib_dupe_delete_confirm', 'Delete {name}?');
    showConfirmModal(msg.replace('{name}', name), () => _mibDupDeleteConfirmed(name, inUse));
}

async function _mibDupDeleteConfirmed(name, inUse) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'delete_mib'),
                              { ...(modulesData[modName] || {}), name, kind: 'raw' });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    // What was compiled came from the file that just went: saying so here is the difference
    // between a stale module and a stale module somebody knows about.
    showToast(inUse
        ? _ms('mib_dupe_deleted_used', 'Deleted — another copy takes over, compile it again')
        : _ms('mib_n_deleted', '{n} file(s) deleted').replace('{n}', 1));
    await _mibLoad();
    const left = (_mibData && _mibData.dupes && _mibData.dupes[_mibDupMib]) || null;
    if (left) _mibDupesShow(_mibDupMib);
    else bootstrap.Modal.getOrCreateInstance(
        document.getElementById('mibDetailsModal')).hide();
}

// A history whose file is gone: put the file back, or let the history go. Both need the
// MODULE name and nothing else — there is no file to resolve anything from, which is exactly
// what makes these rows the ones that could not be reached before.
async function _mibOrphanRestore(mib) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'restore_orphan'),
                              { ...(modulesData[modName] || {}), mib });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    showToast(_ms('mib_orphan_restored', '{name} is back — compile it again')
              .replace('{name}', d.relpath || mib));
    await _mibLoad();
}

function _mibOrphanForget(mib, versions) {
    showConfirmModal(
        _ms('mib_orphan_forget_confirm',
            'Delete the {n} stored version(s) of {name}? The file is already gone, so this '
            + 'is the last copy.')
            .replace('{n}', versions).replace('{name}', mib),
        () => _mibOrphanForgetConfirmed(mib));
}

async function _mibOrphanForgetConfirmed(mib) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'forget_mib_versions'),
                              { ...(modulesData[modName] || {}), mib });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    showToast(_ms('mib_version_deleted', 'Version deleted'));
    await _mibLoad();
}

// The line a compiler named, if it named one.  pysmi says "…, line 21"; that number is the
// difference between "this file is broken" and being able to look at what is broken.
function _mibErrorLine(msg) {
    const m = /\bline\s+(\d+)/i.exec(String(msg || ''));
    return m ? parseInt(m[1], 10) : 0;
}

function _mibRow(r) {
    const checked = _mibSelection.has(r.mib) ? ' checked' : '';
    const icon = r.state === 'builtin' ? 'bi-file-earmark-lock text-secondary'
               : r.state === 'orphan'  ? 'bi-clock-history text-info'
               : r.state === 'failed'  ? 'bi-file-earmark-x text-danger'
               : r.state === 'pending' ? 'bi-file-earmark-text text-warning'
               : r.state === 'stale'   ? 'bi-file-earmark-diff text-warning'
               : r.state === 'stray'   ? 'bi-file-earmark-excel text-danger'
               : r.state === 'dep'     ? 'bi-file-earmark-code text-secondary'
               :                         'bi-file-earmark-check text-success';
    // Copies of the same module. Amber when they are not the same file: identical copies are
    // clutter, different ones are a decision waiting to be made — and until it is made, which
    // one gets compiled is decided by the alphabet.
    const copies = r.raws.length > 1
        ? `<button type="button" class="badge border-0 flex-shrink-0 ${r.dupe && !r.dupe.same ? 'bg-warning text-dark' : 'bg-secondary'}"
                 style="font-size:.6rem;cursor:pointer"
                 onclick="_mibDupesShow(${jsStr(r.mib)})"
                 title="${escAttr(r.dupe
                     ? (r.dupe.same
                        ? _ms('mib_dupe_same_tooltip', 'Copies of the same module, all with the same content')
                        : _ms('mib_dupe_diff_tooltip', 'Copies of the same module with DIFFERENT content — only one is compiled'))
                     : r.raws.join(' · '))}">&times;${r.raws.length}</button>`
        : '';
    const btn = 'btn btn-sm btn-secondary py-0 px-1 flex-shrink-0';
    return `<div class="d-flex align-items-center gap-2 px-2 py-1 rounded border"
                 style="background:var(--bs-body-bg)">
        <input type="checkbox" class="form-check-input flex-shrink-0"${checked}
               onchange="_mibToggleSelect(${jsStr(r.mib)})">
        <i class="bi ${icon} flex-shrink-0" style="font-size:.9rem"></i>
        <span class="flex-grow-1 text-truncate" style="font-size:.8rem"
              title="${escAttr(r.key + (r.file ? ` — ${r.file}` : ''))}">${r.dir ? `<span class="text-muted">${esc(r.dir)}/</span>` : ''}${esc(r.mib)}${r.file ? `<span class="text-muted ms-1" style="font-size:.72rem">(${esc(r.file)})</span>` : ''}</span>
        ${copies}
        ${r.version > 1 ? `<span class="badge bg-info text-dark flex-shrink-0"
                 style="font-size:.6rem"
                 title="${escAttr(_ms('mib_edited_tooltip', 'Edited here — v1 is the file as the vendor shipped it'))}">v${r.version}</span>` : ''}
        ${_mibStateBadge(r)}
        <span class="text-muted flex-shrink-0" style="font-size:.72rem">${_mibSz(r.size)}</span>
${(() => {
        if (!r.raws.length) return '';
        // Arriving from a failure, the viewer opens ON the line rather than at the top: the
        // whole value of the reason is the line, and scrolling to it by hand loses it.
        const ln = _mibErrorLine(r.error);
        // The copy pysmi would read, when there is more than one: opening the first by
        // alphabet shows a file that may have nothing to do with what got compiled.
        const shown = (r.dupe && r.dupe.used) || r.raws[0];
        return `
        <button class="${btn}" title="${escAttr(ln
                    ? _ms('mib_view_raw_at', 'View source at the failing line')
                    : _ms('mib_view_raw', 'View source file'))}"
                onclick="_mibShowRawDetails(${jsStr(shown)}${ln ? ', ' + ln : ''})">
            <i class="bi bi-eye" style="font-size:.75rem"></i>
        </button>`;
    })()}
        ${r.py ? `
        <button class="${btn}" title="${escAttr(_ms('mib_view_symbols', 'View compiled symbols'))}"
                onclick="_mibShowDetails(${jsStr(r.py)})">
            <i class="bi bi-diagram-3" style="font-size:.75rem"></i>
        </button>` : ''}
        ${r.raws.length && r.state !== 'builtin' ? `
        <button class="${btn}" title="${escAttr(_ms('mib_compile_one', 'Compile'))}"
                ${_mibData && !_mibData.pysmi_available ? 'disabled' : ''}
                onclick="_compileMibs([${jsStr(r.raws[0])}])">
            <i class="bi bi-gear" style="font-size:.75rem"></i>
        </button>` : ''}
        ${r.state === 'orphan' ? `
        <button class="${btn}" title="${escAttr(_ms('mib_orphan_restore', 'Bring the file back from its history'))}"
                onclick="_mibOrphanRestore(${jsStr(r.mib)})">
            <i class="bi bi-arrow-counterclockwise" style="font-size:.75rem"></i>
        </button>
        <button class="btn btn-sm btn-danger py-0 px-1 flex-shrink-0"
                title="${escAttr(_ms('mib_orphan_forget', 'Delete this history'))}"
                onclick="_mibOrphanForget(${jsStr(r.mib)},${r.orphanVersion})">
            <i class="bi bi-trash3" style="font-size:.75rem"></i>
        </button>` : `
        ${_mibDeleteBtn(r)}`}
    </div>`;
}

// A compiled module is an OUTPUT: deleting it is how you ask for it to be made again, which
// is the way out of a .py built from a file that is no longer the one that would be compiled
// today. And a source can go while the .py it produced stays loaded — worth being able to do
// on purpose, and worth never doing by accident. The menu only appears when the row really
// holds both: with one file there is nothing to choose and a caret would say there is.
function _mibDeleteBtn(r) {
    const one = `<button class="btn btn-sm btn-danger py-0 px-1 flex-shrink-0"
                title="${escAttr(t('delete') || 'Delete')}"
                onclick="_mibDeleteRow(${jsStr(r.mib)})">
            <i class="bi bi-trash3" style="font-size:.75rem"></i>
        </button>`;
    if (!r.raws.length || !r.py) return one;
    return `<div class="btn-group btn-group-sm flex-shrink-0">${one}
        <button class="btn btn-sm btn-danger dropdown-toggle dropdown-toggle-split py-0 px-1"
                type="button" data-bs-toggle="dropdown" aria-expanded="false"
                title="${escAttr(_ms('mib_delete_what', 'What to delete'))}"></button>
        ${_mibDeleteMenu(`_mibDeleteRow(${jsStr(r.mib)},`)}
    </div>`;
}

// The three choices, written once: the row and the selection ask the same question of a
// different set, and two copies of a menu are two menus that drift.
function _mibDeleteMenu(call) {
    const item = (scope, icon, label) => `<li><button class="dropdown-item"
            onclick="${call}'${scope}')"><i class="bi ${icon} me-1"></i>${esc(label)}</button></li>`;
    return `<ul class="dropdown-menu dropdown-menu-end">
        ${item('all', 'bi-trash3', _ms('mib_delete_everything', 'Everything'))}
        ${item('compiled', 'bi-gear', _ms('mib_delete_only_compiled', 'Only the compilation'))}
        ${item('raw', 'bi-file-earmark-text', _ms('mib_delete_only_raw', 'Only the source'))}
    </ul>`;
}

// What a compiler will object to, said in the file's own terms and with the line. pysmi
// answers "Bad grammar near offset 558" and "Unknown parents for symbols: …" — the first says
// where it gave up, the second names the symbols it could not PLACE rather than the import
// that is missing. Both are one step away from the thing to fix.
function _mibLintRows(findings) {
    return (findings || []).map(f => [`${_ms('mib_error_line', 'line')} ${f.line}`, f.message]);
}

async function _mibLint(payload) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'lint_mib_source'),
                              { ...(modulesData[modName] || {}), ...payload });
    const d = res && res.data;
    return (d && d.ok) ? (d.findings || []) : null;
}

// From the editor: on what is on screen, not on what is on disk — the point is to answer
// before saving, while the change is still a change.
async function _mibLintNow() {
    if (!_mibSrcEditor) return;
    const findings = await _mibLint({name: _mibEditName, content: _mibSrcEditor.getValue()});
    if (findings === null) { showToast(t('error') || 'Error', 'error'); return; }
    if (!findings.length) {
        showToast(_ms('mib_lint_clean', 'Nothing here will stop the compiler'));
        return;
    }
    showInfoModal(_mibEditName, _mibLintRows(findings),
                  _ms('mib_lint_found', 'These will stop the compiler.'), 'warning');
}

// The full reason, verbatim.  Nothing is reworded on the way: it is a compiler's message
// about a specific line of a specific file, and paraphrasing it would cost the one detail
// that makes it actionable.
async function _mibShowError(mib) {
    const r = _mibRows().find(x => x.mib === mib);
    if (!r || !r.error) return;
    const rows = [[_ms('mib_error_file', 'File'), r.key]];
    if (r.errorAt) {
        rows.push([_ms('mib_error_when', 'Last attempt'),
                   new Date(r.errorAt * 1000).toLocaleString()]);
    }
    rows.push([_ms('mib_error_reason', 'Reason'), r.error]);
    // The compiler's message says where it stopped; these say what to change. Read now and
    // not stored with the error, so they are about the file as it is — an error kept from
    // last week beside hints from last week is two stale things agreeing with each other.
    const findings = await _mibLint({name: r.raws[0] || ''});
    for (const f of _mibLintRows(findings)) rows.push(f);
    showInfoModal(r.mib, rows,
                  _ms('mib_error_lead', 'This MIB could not be compiled.'), 'danger');
}

// One folder chosen, or a small enough tree, is a plain list. Otherwise the folders become
// headers you open — which is the only thing that makes two thousand rows a screen you can
// actually work in.
function _mibListHtml(shown) {
    const groups = _mibGroups(shown);
    const q = (document.getElementById('mibSearch')?.value || '').trim();
    if (_mibFolder || groups.size < 2 || shown.length <= _MIB_AUTO_EXPAND) {
        return shown.map(r => _mibRow(r)).join('');
    }
    let h = '';
    for (const [g, rs] of groups) {
        // A search that finds something inside a closed folder and shows nothing is a search
        // that looks broken, so a match opens the folder it is in.
        const open = !!q || _mibOpenGroups.has(g);
        h += _mibGroupHeader(g, rs, open);
        if (open) h += `<div class="d-flex flex-column gap-1 ps-3">${rs.map(r => _mibRow(r)).join('')}</div>`;
    }
    return h;
}

// The folders, with how many rows each holds — over the WHOLE tree, not over whatever is
// filtered right now: a folder's size is a property of the folder, and a count that moves as
// you type is a count nobody can use to decide where to look.
function _mibGroups(rows) {
    const out = new Map();
    for (const r of rows) {
        if (!out.has(r.group)) out.set(r.group, []);
        out.get(r.group).push(r);
    }
    const rank = k => (k === _MIB_DEP_GROUP ? 2 : k === _MIB_STRAY_GROUP ? 1 : 0);
    return new Map([...out.entries()].sort(
        (a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0])));
}

function _mibGroupLabel(g) {
    if (g === _MIB_DEP_GROUP) return _ms('mib_group_deps', 'dependencies');
    if (g === _MIB_STRAY_GROUP) return _ms('mib_group_stray', 'source deleted');
    return g || _ms('mib_group_root', 'top level');
}

function _mibFolderSelect(rows) {
    const groups = _mibGroups(rows);
    // One folder and nothing else is not a choice — and the control would be a permanent
    // reminder of a tree that has no branches.
    if (groups.size < 2) return '';
    const opts = [...groups.entries()].map(([g, rs]) =>
        `<option value="${escAttr(g)}"${_mibFolder === g ? ' selected' : ''}>${esc(_mibGroupLabel(g))} (${rs.length})</option>`).join('');
    return `<select class="form-select form-select-sm" style="width:auto;max-width:14rem"
                    onchange="_mibSetFolder(this.value)">
        <option value=""${_mibFolder === '' ? ' selected' : ''}>${esc(_ms('mib_folder_all', 'All folders'))} (${rows.length})</option>
        ${opts}
    </select>`;
}

function _mibSetFolder(g) {
    _mibFolder = g || '';
    _mibFilterLists();
}

function _mibGroupToggle(g) {
    if (_mibOpenGroups.has(g)) _mibOpenGroups.delete(g);
    else                       _mibOpenGroups.add(g);
    _mibFilterLists();
}

// Selecting a folder is the action the header was missing: compiling or deleting a vendor's
// worth of MIBs is one of the few things anybody does in bulk here, and doing it by ticking
// six hundred boxes is not doing it.
//
// A row rather than one big button, because a checkbox inside a <button> is a control inside
// a control: the browser is entitled to swallow the click, and which one wins is not
// something to leave to chance.
function _mibGroupHeader(g, rs, open) {
    const sel = rs.filter(r => _mibSelection.has(r.mib)).length;
    const all = sel === rs.length && rs.length > 0;
    // How many are DONE, not how many exist. A folder of six hundred says nothing on its own;
    // "588/612" says where the work is, and which vendor to open. A stale one does not count:
    // it has a compiled module, from bytes that are no longer there, and the whole reason
    // that state exists is that it needs compiling again. Nor does a leftover: it has a
    // compiled module and no source at all, and a group of them reading "374/374" in green
    // would be the screen calling a pile of junk finished work.
    const done = rs.filter(r => r.py && r.state !== 'stale' && r.state !== 'stray').length;
    return `<div class="d-flex align-items-center gap-2 px-2 py-1 rounded border"
                 style="background:var(--bs-secondary-bg);font-size:.78rem">
        <input type="checkbox" class="form-check-input flex-shrink-0 mib-group-check"
               data-group="${escAttr(g)}" data-some="${sel > 0 && !all ? '1' : ''}"
               ${all ? 'checked' : ''}
               title="${escAttr(_ms('mib_group_select', 'Select every MIB in this folder'))}"
               onchange="_mibGroupSelect(${jsStr(g)}, this.checked)">
        <span class="d-flex align-items-center gap-2 flex-grow-1 text-truncate"
              role="button" tabindex="0" style="cursor:pointer"
              onclick="_mibGroupToggle(${jsStr(g)})"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();_mibGroupToggle(${jsStr(g)});}">
            <i class="bi ${open ? 'bi-chevron-down' : 'bi-chevron-right'} flex-shrink-0"
               style="font-size:.7rem"></i>
            <i class="bi ${g === _MIB_DEP_GROUP ? 'bi-tools'
                         : g === _MIB_STRAY_GROUP ? 'bi-folder-x'
                         : 'bi-folder2'} flex-shrink-0"></i>
            <span class="fw-semibold text-truncate">${esc(_mibGroupLabel(g))}</span>
        </span>

// Only what is VISIBLE in that folder: with a state chip or a search active, the header ticks

function _mibGroupSelect(g, on) {

// The state chips double as the counts: "what is there, and what is still missing" is the

function _mibChips(c) {

        ['all',      _ms('mib_filter_all', 'All'),          c.all],

        ['compiled', _ms('mib_filter_compiled', 'Compiled'), c.compiled],
        ['dep',      _ms('mib_filter_dep', 'Dependencies'), c.dep],
        ['orphan',   _ms('mib_filter_orphan', 'History only'), c.orphan],

// Generic entry point called by the dashboard's file_manager button.
// The function name is fixed so the web_admin generic code can call it
// without any module-specific knowledge.
// ── The MIB manager, as a section of the System panel ─────────────────────────
//
// It was a modal, opened from a button on the module card, and the modal was the constraint:
// a list that had to reach the bottom of a dialog somebody can drag, a source viewer three
// levels deep, a diff inside a tab inside a dialog. The module declares a page now
// (schema.json → `__page__`, placement "system"), the core gives it a pane beside Services
// and Credentials, and this paints it.
//
// The markup is cloned from a <template> rather than built here: it is markup, and 120 lines
// of it inside a JavaScript string is 120 lines nobody can read as HTML again.
async function renderSnmpMibsPage() {
    // Which module this page belongs to, asked of the registry instead of written down: the
    // page descriptor names its own render function, so the entry that points here is the
    // entry that says whose it is.
    const spec = (window.SS_STANDALONE_PAGES || [])
        .find(p => p.render === 'renderSnmpMibsPage') || {};
    const box = document.getElementById((spec.id || 'snmp') + '-container');
    if (!box) return;
    _mibManagerModuleName = spec.module || 'snmp';

    // WHICH view: the section declares two (the library and the import page) and the URL is
    // what says which one — resolved by the core, because a view is a sub-path and the path
    // is the core's business. Asked rather than remembered here, so a link somebody sends
    // lands on the view it names.
    const view = ((typeof _sbPageView === 'function') ? _sbPageView(spec.id || 'snmp') : '')
                 || 'library';

    // Painted once PER VIEW. Coming back to the library re-reads the MIBs, but rebuilding the
    // whole panel would throw away the folder that was open, the filter and the search box —
    // the same thing that made leaving the editor feel like a page reload.
    if (box.dataset.snmpView !== view) {
        const tpl = document.getElementById(
            view === 'import' ? 'snmpImportPageTpl' : 'snmpMibsPageTpl');
        if (!tpl) return;
        box.replaceChildren(tpl.content.cloneNode(true));
        box.dataset.snmpView = view;
        (view === 'import' ? _snmpImportPageLabels : _snmpMibsPageLabels)();
        // A job started on the other view is still running and still has its widgets here —
        // same ids, one document. Repaint its state instead of showing an empty bar.
        if (_mibCompileInProgress || _mibGithubInProgress || _mibArchiveInProgress)
            _mibProgressBegin();
    }

    if (view === 'import') return _mibImportViewLoad();

    _mibData = null;
    _mibCompileAbort = false;
    if (!_mibCompileInProgress && !_mibGithubInProgress && !_mibArchiveInProgress)
        _mibProgressHide();
    await _mibLoad();
}

// What the import view needs is two lists of sources — and it used to ask `list_mibs` for
// them, which is the whole inventory: every file in the tree, a header read out of each one,
// the colliding ones hashed and the pending set worked out. Seconds, on a library with
// LibreNMS in it, to fill two dropdowns. `list_mib_sources` answers the same two keys off a
// list that is already in memory.
async function _mibImportViewLoad() {
    const modName = _mibManagerModuleName;
    if (!modName) return;
    const res = await apiPost(_mibApiUrl(modName, 'list_mib_sources'),
                              modulesData[modName] || {});
    const d = res && res.data;
    if (!d || !d.ok) return;
    // NOT into `_mibData`: that is the library's payload and half of it is missing here.
    // Whoever reads it next must find the whole thing or nothing.
    _mibPopulateImportSources(d);
}

// The module card's button still opens the manager — it just goes to the section now
// instead of throwing a dialog over what you were doing.
function openFileManagerModal(modName) {

// Reading the library is the expensive call in this module — the whole tree, one header per
// file — and opening a section fires the render more than once (the tab shows, and the view
// is resolved), which used to be two of them racing. One in flight is one answer: the second
// caller waits for the first instead of asking again.
let _mibLoadInFlight = null;
async function _mibLoad() {
    const modName = _mibManagerModuleName;
    if (!modName) return;
    if (_mibLoadInFlight) return _mibLoadInFlight;
    _mibSelection = new Set();
    const modCfg = modulesData[modName] || {};
    _mibLoadInFlight = apiPost(_mibApiUrl(modName, 'list_mibs'), modCfg);
    let res = null;
    try { res = await _mibLoadInFlight; } finally { _mibLoadInFlight = null; }
    _mibRender(res && res.data);
}

function _mibRender(data) {
    const body = document.getElementById('mibManagerBody');
    if (!body) return;

    if (!data || !data.ok) {
        _mibData = null;
        // A bare "Error" is what the panel showed when the request itself died — no payload,
        // no message, nothing to act on. The two cases are different and read differently:
        // the server refusing says why, and the server never answering is worth saying so.
        const msg = (data && data.message) || _ms('mib_list_failed',
            'The MIB list could not be read — the request did not come back.');
        body.innerHTML = `<div class="text-danger text-center py-3 small">
            <i class="bi bi-exclamation-triangle me-1"></i>${esc(msg)}
        </div>`;
        return;
    }

    _mibData = data;

    // The modules the raw files declare — a compiled .py that is not one of them was pulled
    // in by pysmi as a dependency and not asked for. Used to tag those rows and to break down
    // the post-compile count.
    _mibRawModules = new Set((data.raw || []).map(
        f => f.module || f.name.replace(/\.[^.]*$/, '')));

    // GitHub import dropdown + compile dependency-source toggles
    _mibPopulateGithub(data);

    // pysmi availability badge — only visible when pysmi is MISSING
    const pysmiBadge = document.getElementById('mibPysmiStatus');
    if (pysmiBadge) {
        if (data.pysmi_available) {
            pysmiBadge.style.display = 'none';
        } else {
            pysmiBadge.style.display = '';
            pysmiBadge.className = 'badge rounded-pill flex-shrink-0 bg-warning text-dark';
            pysmiBadge.textContent = _ms('mib_pysmi_missing', 'pysmi not installed');
            pysmiBadge.title = _ms('mib_pysmi_hint', 'pip install pysmi');
        }
    }

    // Raw directory path
    const dirInfo = document.getElementById('mibDirInfo');
    if (dirInfo) {
        dirInfo.textContent = (_ms('mib_raw_dir', 'Raw:') + ' ' + (data.raw_dir || '')).trim();
        dirInfo.title = data.raw_dir || '';
    }

    // Disable compile button when no raw files or pysmi missing.  A reload that
    // happens mid-compile (e.g. user clicks Refresh) must NOT re-enable it; keep
    // the running-state buttons in sync with the active compile job.
    const compileBtn = document.getElementById('mibCompileBtn');
    if (compileBtn) compileBtn.disabled =
        _mibCompileInProgress || !data.pysmi_available || !data.raw.length;
    // The Stop button must survive a manual Refresh while any cancellable job
    // (compile or GitHub import) is running.
    const stopBtnR = document.getElementById('mibStopBtn');
    if (stopBtnR) stopBtnR.style.display =
        (_mibCompileInProgress || _mibGithubInProgress || _mibArchiveInProgress)
            ? 'inline-block' : 'none';
    const compLblR = document.getElementById('mibCompileBtnLabel');
    if (compLblR && _mibCompileInProgress) compLblR.textContent = _ms('mib_compiling', 'Compiling…');
    const compSelBtnR = document.getElementById('mibCompileSelBtn');
    if (compSelBtnR && _mibCompileInProgress) compSelBtnR.disabled = true;

    // Preserve the search query across reloads (upload / delete / compile)
    const _sq = document.getElementById('mibSearch')?.value || '';

    // The header is fixed and the list is the .ss-vscroll under it: that pair is what makes
    // the list end at the bottom edge of the modal instead of at a height of its own.
    body.innerHTML = _mibListHeader(_mibRows())
        + '<div id="mibList" class="ss-vscroll d-flex flex-column gap-1"></div>';

    const inp = document.getElementById('mibSearch');
    if (inp && _sq) inp.value = _sq;

    _mibFilterLists();
}

// Apply search filters and re-render both file lists.
// Called on every keystroke and after each data reload.
function _mibFilterLists() {
    if (!_mibData) return;
    const all   = _mibRows();
    const shown = _mibVisibleRows();

    // The chips carry the counts, so they are re-rendered whenever the counts can have
    // changed — which includes mid-compile, as pending rows turn into compiled ones.
    const chips = document.getElementById('mibFilterChips');
    if (chips) chips.innerHTML = _mibChips(_mibCounts(all));

    const sel = document.getElementById('mibFolderSel');
    if (sel) sel.innerHTML = _mibFolderSelect(all);

    const list = document.getElementById('mibList');
    if (list) {
        if (!all.length)      list.innerHTML = _mibEmptyBox(
            _ms('mib_no_raw', 'No .mib files yet — upload one to get started'));
        else if (!shown.length) list.innerHTML = _mibNoMatch();
        else                  list.innerHTML = _mibListHtml(shown);
    }
    _mibGroupCheckStates();
    _mibUpdateCompileBtn();
    _mibUpdateDeleteBtn();

// Half the leftovers ARE countable from the listing — a compiled module with no source is a
// row. The other half (a vendor folder emptied of its files) is not: the listing is a list of
// files and an empty folder holds none. So the button carries the number it has and asks the
// server for the rest when it is pressed.
function _mibUpdateCleanBtn(rows) {
    const n   = rows.filter(r => r.state === 'stray').length;
    const cnt = document.getElementById('mibCleanCount');
    if (cnt) cnt.textContent = n ? String(n) : '';

// ── The MIB source, in an editor instead of a wall of text ────────
//
// pysmi reports a failure BY LINE — "Bad grammar near offset 558 … line 21" — and a <pre>
// has no lines to count: you scroll and guess. CodeMirror is already in the panel (the
// notification-template editor uses it) and its loader is core, so the numbers cost nothing
// but the asking. The colour costs one mode, because CodeMirror 5 ships none for ASN.1/SMI.
//
// Deliberately a lexer and not a parser: it must colour a file that DOES NOT PARSE, which is
// exactly when somebody is reading it. A mode that needed the grammar to hold would give up
// on the one file worth looking at.
let _mibSrcEditor = null;

// Where the numbering has to be right for: the words that open a definition…
const _MIB_KEYWORDS = /^(?:DEFINITIONS|BEGIN|END|IMPORTS|EXPORTS|FROM|MACRO|MODULE-IDENTITY|MODULE-COMPLIANCE|OBJECT-TYPE|OBJECT-IDENTITY|OBJECT-GROUP|OBJECT|IDENTIFIER|NOTIFICATION-TYPE|NOTIFICATION-GROUP|TRAP-TYPE|AGENT-CAPABILITIES|TEXTUAL-CONVENTION|SEQUENCE|CHOICE|OF|SYNTAX|WRITE-SYNTAX|MAX-ACCESS|MIN-ACCESS|ACCESS|STATUS|DESCRIPTION|REFERENCE|INDEX|IMPLIED|AUGMENTS|DEFVAL|UNITS|LAST-UPDATED|ORGANIZATION|CONTACT-INFO|REVISION|DISPLAY-HINT|ENTERPRISE|VARIABLES|OBJECTS|NOTIFICATIONS|MODULE|MANDATORY-GROUPS|GROUP|SIZE|SUPPORTS|INCLUDES|PRODUCT-RELEASE|VARIATION|CREATION-REQUIRES)$/;
// …the built-in types a value can have…
const _MIB_TYPES = /^(?:INTEGER|Integer32|Unsigned32|Counter|Counter32|Counter64|Gauge|Gauge32|TimeTicks|OCTET|STRING|IpAddress|NetworkAddress|Opaque|BITS|Bits|DisplayString|PhysAddress|MacAddress|TruthValue|RowStatus|TestAndIncr|AutonomousType|InstancePointer|TimeStamp|TimeInterval|DateAndTime|StorageType|TDomain|TAddress)$/;
// …and the words that say what a thing is FOR, which is what an eye scanning a table wants.
const _MIB_ATOMS = /^(?:read-only|read-write|read-create|not-accessible|accessible-for-notify|write-only|current|deprecated|obsolete|mandatory|optional|true|false|null)$/;

function _mibDefineMode() {
    if (typeof CodeMirror === 'undefined' || (CodeMirror.modes && CodeMirror.modes.mib)) return;
    CodeMirror.defineMode('mib', function () {
        return {
            startState: () => ({inString: false}),
            token: function (stream, state) {
                // A DESCRIPTION runs over many lines, so the string state outlives the line.
                if (state.inString) {
                    while (!stream.eol()) {
                        if (stream.next() === '"') { state.inString = false; break; }
                    }
                    return 'string';
                }
                if (stream.eatSpace()) return null;
                // ASN.1 comments open with `--` and close with `--` or the end of the line.
                if (stream.match('--')) {
                    if (!stream.skipTo('--')) stream.skipToEnd();
                    else stream.match('--');
                    return 'comment';
                }
                if (stream.peek() === '"') {
                    stream.next();
                    state.inString = true;
                    while (!stream.eol()) {
                        if (stream.next() === '"') { state.inString = false; break; }
                    }
                    return 'string';
                }
                if (stream.match('::=')) return 'operator';
                if (stream.match(/^[{}()[\],;|.]/)) return 'bracket';
                if (stream.match(/^-?\d+/)) return 'number';
                const w = stream.match(/^[A-Za-z][A-Za-z0-9-_]*/);
                if (w) {
                    const t = w[0];
                    if (_MIB_KEYWORDS.test(t)) return 'keyword';
                    if (_MIB_TYPES.test(t))    return 'type';
                    if (_MIB_ATOMS.test(t))    return 'atom';
                    // In SMI the CASE of the first letter is the meaning: uppercase is a type
                    // reference, lowercase a value. Colouring them apart is not decoration —
                    // it is the distinction a malformed vendor MIB gets wrong.
                    return /^[A-Z]/.test(t) ? 'def' : 'variable';
                }
                stream.next();
                return null;
            },
        };
    });
}


// pysmi writes Python, and CodeMirror 5 ships no mode for that here either (the bundled ones
// are css, xml, javascript and htmlmixed). Same shape as the MIB mode and for the same
// reason: a lexer colours a file whatever state it is in.
const _PY_KEYWORDS = /^(?:def|class|return|yield|if|elif|else|for|while|break|continue|pass|import|from|as|with|try|except|finally|raise|assert|lambda|global|nonlocal|del|and|or|not|in|is|async|await)$/;
const _PY_ATOMS = /^(?:None|True|False|self|cls)$/;

function _mibDefinePyMode() {
    if (typeof CodeMirror === 'undefined' || (CodeMirror.modes && CodeMirror.modes.pysnmp)) return;
    CodeMirror.defineMode('pysnmp', function () {
        return {
            startState: () => ({triple: null}),
            token: function (stream, state) {
                // A pysmi module is mostly one enormous call chain with docstrings in it; a
                // triple-quoted string outlives its line the same way a DESCRIPTION does.
                if (state.triple) {
                    while (!stream.eol()) {
                        if (stream.match(state.triple)) { state.triple = null; break; }
                        stream.next();
                    }
                    return 'string';
                }
                if (stream.eatSpace()) return null;
                if (stream.peek() === '#') { stream.skipToEnd(); return 'comment'; }
                const triple = stream.match(/^(?:'{3}|"{3})/);
                if (triple) {
                    state.triple = triple[0];
                    while (!stream.eol()) {
                        if (stream.match(state.triple)) { state.triple = null; break; }
                        stream.next();
                    }
                    return 'string';
                }
                const q = stream.match(/^[br]?['"]/);
                if (q) {
                    const ch = q[0].slice(-1);
                    while (!stream.eol()) {
                        const c = stream.next();
                        if (c === '\\') { stream.next(); continue; }
                        if (c === ch) break;
                    }
                    return 'string';
                }
                if (stream.match(/^-?\d[\d_]*(?:\.\d+)?/)) return 'number';
                if (stream.match(/^@[A-Za-z_]\w*/)) return 'meta';
                if (stream.match(/^[{}()[\],:;.=+\-*/%<>!|&]/)) return 'bracket';
                const w = stream.match(/^[A-Za-z_]\w*/);
                if (w) {
                    const t = w[0];
                    if (_PY_KEYWORDS.test(t)) return 'keyword';
                    if (_PY_ATOMS.test(t))    return 'atom';
                    return /^[A-Z]/.test(t) ? 'def' : 'variable';
                }
                stream.next();
                return null;
            },
        };
    });
}


// A unified diff, coloured. Three rules and it is done — and of the three modes here it is
// the one that earns the most: a wall of monospace where the +/- at column zero is the whole
// message is exactly the thing an eye cannot scan.
function _mibDefineDiffMode() {
    if (typeof CodeMirror === 'undefined' || (CodeMirror.modes && CodeMirror.modes.mibdiff)) return;
    CodeMirror.defineMode('mibdiff', function () {
        return {
            token: function (stream) {
                if (stream.sol()) {
                    const c = stream.peek();
                    if (c === '@') { stream.skipToEnd(); return 'meta'; }
                    if (c === '+') { stream.skipToEnd(); return 'attribute'; }
                    if (c === '-') { stream.skipToEnd(); return 'string'; }
                }
                stream.skipToEnd();
                return null;
            },
        };
    });
}

// Draw the source into *el*.  If CodeMirror will not load, the old <pre> is still the answer:
// a viewer that fails to be pretty must not fail to be a viewer.
async function _mibRenderSource(el, text, line, mode) {
    if (!el) return;
    const ok = await _ensureCodeMirror();
    if (!ok) {
        el.innerHTML = `<pre class="rounded p-2 mb-0 mib-src-plain">${esc(text || '')}</pre>`;
        return;
    }
    _mibDefineMode();
    _mibDefinePyMode();
    _mibDefineDiffMode();
    el.innerHTML = '';
    const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    if ((mode || 'mib') === 'mib') _mibSrcOnDisk = text || '';
    _mibSrcEditor = CodeMirror(el, {
        value:       text || '',
        mode:        mode || 'mib',
        theme:       isDark ? 'material-darker' : 'eclipse',
        lineNumbers: true,
        readOnly:    true,
        lineWrapping: false,
        viewportMargin: 20,
    });
    // The modal is not laid out yet when this runs; CodeMirror measures on creation and
    // would size itself against nothing.
    setTimeout(() => {
        if (!_mibSrcEditor) return;
        _mibSrcEditor.refresh();
        if (line > 0) {
            const i = line - 1;
            _mibSrcEditor.addLineClass(i, 'background', 'mib-src-badline');
            _mibSrcEditor.scrollIntoView({line: i, ch: 0}, 120);
            _mibSrcEditor.setCursor({line: i, ch: 0});
        }
    }, 60);
}

// ── Editing a MIB, and taking it back ─────────────────────────────
//
// Vendors ship broken MIBs — SYNOLOGY-SMB-MIB has never compiled anywhere — and there is
// nothing to do about that from here except let somebody correct it. A correction nobody can
// undo is one nobody dares make, so the history is the feature and the pencil is the button.
let _mibEditName = '';        // the raw MIB currently open in the editor
let _mibEditOn   = false;     // whether it is editable right now
// What is on disk, as the editor was given it. Leaving edit mode is putting this back — not
// fetching the file again and rebuilding the modal around it, which threw away the tab, the
// scroll position and the editor itself to undo something already in memory.
let _mibSrcOnDisk = '';
let _mibVersions = [];        // its versions, newest first

function _mibEditReset(name) {
    _mibEditName = name || '';
    _mibEditOn   = false;
    _mibVersions = [];
}

// The editor is read-only until asked, because this modal is opened to READ far more often
// than to change anything, and a text box you can type into by accident is a file you can
// break by accident.
function _mibEditToggle(on) {
    if (!_mibSrcEditor) return;
    _mibEditOn = !!on;
    _mibSrcEditor.setOption('readOnly', !_mibEditOn);
    _mibSrcEditor.setOption('styleActiveLine', _mibEditOn);
    if (_mibEditOn) _mibSrcEditor.focus();
    _mibEditRenderBar();
}

function _mibEditRenderBar() {
    const bar = document.getElementById('mibEditBar');
    if (!bar) return;
    const nVer = _mibVersions.length;
    // The note is asked for HERE and not in a dialog after the fact: what a change is for
    // is known while it is being made, and a version list of thirty entries that all say
    // nothing is a list nobody reads twice.
    bar.innerHTML = _mibEditOn
        ? `<button class="btn btn-sm btn-primary" onclick="_mibEditSave()">
               <i class="bi bi-check2 me-1"></i>${esc(_ms('mib_edit_save', 'Save'))}</button>
           <button class="btn btn-sm btn-secondary" onclick="_mibEditCancel()">
               <i class="bi bi-x me-1"></i>${esc(t('cancel') || 'Cancel')}</button>
           <button class="btn btn-sm btn-secondary" onclick="_mibLintNow()">
               <i class="bi bi-clipboard-check me-1"></i>${esc(_ms('mib_lint', 'Check'))}</button>
           <input type="text" id="mibEditNote" class="form-control form-control-sm flex-grow-1"
                  style="min-width:12rem" maxlength="200" autocomplete="off"
                  placeholder="${escAttr(_ms('mib_edit_note_ph', 'What does this change fix? (optional)'))}"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();_mibEditSave();}">`
        : `<button class="btn btn-sm btn-secondary" onclick="_mibEditToggle(true)">
               <i class="bi bi-pencil me-1"></i>${esc(_ms('mib_edit', 'Edit'))}</button>
           ${nVer ? `<button class="btn btn-sm btn-secondary" onclick="_mibVersionsShow()">
               <i class="bi bi-clock-history me-1"></i>${esc(_ms('mib_versions', 'Versions'))}
               <span class="opacity-75 ms-1">${nVer}</span></button>` : ''}`;
}

function _mibEditCancel() {
    // Back to what is on disk — which is a value we already hold, so nothing is fetched and
    // nothing is rebuilt. Leaving the editor is not a request to go and look at something
    // else, and it should not cost the tab you were on or where you had scrolled to.
    if (!_mibSrcEditor) return;
    // Back from a DIFF as well as from an edit: the editor was switched to another language
    // to show it, and text put back under the wrong mode is coloured as something it is not.
    _mibSrcEditor.setOption('mode', 'mib');
    _mibSrcEditor.setValue(_mibSrcOnDisk);
    _mibEditToggle(false);
    _mibSrcEditor.refresh();
}

async function _mibEditSave() {
    if (!_mibSrcEditor || !_mibEditName) return;
    const content = _mibSrcEditor.getValue();
    const note    = (document.getElementById('mibEditNote')?.value || '').trim();
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'save_mib_source'),
                              { ...(modulesData[modName] || {}),
                                name: _mibEditName, content, note });
    const d = res && res.data;
    if (!d || !d.ok) {
        showToast((d && d.message) || (t('error') || 'Error'), 'error');
        return;
    }
    if (d.unchanged) {
        showToast(_ms('mib_edit_unchanged', 'Nothing changed'));
        _mibEditToggle(false);
        return;
    }
    _mibVersions = d.versions || [];
    _mibSrcOnDisk = content;          // this IS the file now
    _mibVersionsDraw();
    showToast(_ms('mib_edit_saved', 'Saved — the MIB has to be compiled again'));
    _mibEditToggle(false);
    // What the file declares has changed, so that tab is quietly wrong — redraw THAT, not
    // the modal. And the list behind: its compiled module is now older than its source, and
    // any recorded failure was about bytes that are gone.
    await _mibDeclRefresh();
    await _mibLoad();
}

async function _mibVersionsLoad(name) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'list_mib_versions'),
                              { ...(modulesData[modName] || {}), name });
    const d = res && res.data;
    _mibVersions = (d && d.ok && d.versions) || [];
    _mibEditRenderBar();
}

function _mibVersionRow(v) {
    const when = v.created_at ? new Date(v.created_at * 1000).toLocaleString() : '';
    const who  = v.author || _ms('mib_version_system', 'system');

                                       : (v.note || '');
    return `<div class="d-flex align-items-center gap-2 px-2 py-1 rounded border"
                 style="background:var(--bs-body-bg)">
        <span class="badge bg-secondary flex-shrink-0" style="font-size:.62rem">v${v.version}</span>
        ${v.parent ? `<span class="text-muted flex-shrink-0" style="font-size:.62rem"
              title="${escAttr(_ms('mib_version_parent_tip', 'The version this one was written on top of'))}">← v${v.parent}</span>` : ''}
        <span class="flex-grow-1 text-truncate" style="font-size:.78rem">
            ${esc(when)} <span class="text-muted">· ${esc(who)}</span>
            ${note ? `<span class="text-muted"> · ${esc(note)}</span>` : ''}
        </span>
        <span class="text-muted flex-shrink-0" style="font-size:.72rem">${_mibSz(v.size)}</span>
        <button class="btn btn-sm btn-secondary py-0 px-1 flex-shrink-0"
                title="${escAttr(_ms('mib_version_view', 'View this version'))}"
                onclick="_mibVersionView(${jsStr(v.uid)},${v.version})">
            <i class="bi bi-eye" style="font-size:.75rem"></i>
        </button>
        <button class="btn btn-sm btn-secondary py-0 px-1 flex-shrink-0"
                title="${escAttr(v.parent
                    ? _ms('mib_version_diff_parent', 'What this version changed')
                    : _ms('mib_version_diff', 'Compare with the current file'))}"
                onclick="_mibVersionDiff(${jsStr(v.uid)},${v.version},${jsStr(_mibParentUid(v))})">
            <i class="bi bi-file-diff" style="font-size:.75rem"></i>
        </button>
        <button class="btn btn-sm btn-warning py-0 px-1 flex-shrink-0"
                title="${escAttr(_ms('mib_version_restore', 'Restore this version'))}"
                onclick="_mibVersionRestore(${jsStr(v.uid)},${v.version})">
            <i class="bi bi-arrow-counterclockwise" style="font-size:.75rem"></i>
        </button>
        <button class="btn btn-sm btn-danger py-0 px-1 flex-shrink-0"
                title="${escAttr(_ms('mib_version_delete', 'Delete this version'))}"
                onclick="_mibVersionDelete(${jsStr(v.uid)},${v.version},${v.note === 'original'})">
            <i class="bi bi-trash3" style="font-size:.75rem"></i>
        </button>
    </div>`;
}

function _mibVersionsShow() {
    const box = document.getElementById('mibVersionsBox');
    if (!box) return;
    const open = box.style.display !== 'none';
    box.style.display = open ? 'none' : '';
    if (!open) _mibVersionsDraw();
}

// Redraw the open list in place. A save adds a version, and a list left open showing the
// state before it is a list that lies about the thing that just happened.
function _mibVersionsDraw() {
    const box = document.getElementById('mibVersionsBox');
    if (!box || box.style.display === 'none') return;
    box.innerHTML = `<div class="d-flex flex-column gap-1 mt-2 ss-scroll-box">
        ${_mibVersions.map(v => _mibVersionRow(v)).join('')}</div>`;
}

async function _mibVersionView(uid, version) {
    const modName = _mibManagerModuleName;
    const res = await apiPost(_mibApiUrl(modName, 'get_mib_version'),
                              { ...(modulesData[modName] || {}), uid });
    const d = res && res.data;
    if (!d || !d.ok) { showToast((d && d.message) || (t('error') || 'Error'), 'error'); return; }
    // Shown in the editor, read-only and clearly labelled: this is NOT what is on disk, and
    // an old version that looks like the current one is how the wrong file gets compiled.
    if (_mibSrcEditor) {
        _mibEditToggle(false);
        _mibSrcEditor.setOption('mode', 'mib');   // it may be arriving from a diff
        _mibSrcEditor.setValue(d.source || '');
        _mibSrcEditor.refresh();
    }
    const bar = document.getElementById('mibEditBar');
    if (bar) {
        bar.innerHTML = `<span class="badge bg-warning text-dark">
                ${esc(_ms('mib_version_viewing', 'Viewing v'))}${version}</span>
            <button class="btn btn-sm btn-warning" onclick="_mibVersionRestore(${jsStr(uid)},${version})">
                <i class="bi bi-arrow-counterclockwise me-1"></i>${esc(_ms('mib_version_restore', 'Restore'))}</button>
            <button class="btn btn-sm btn-secondary" onclick="_mibEditCancel()">
                <i class="bi bi-x me-1"></i>${esc(_ms('mib_version_back', 'Back to the current file'))}</button>`;
    }
}

// The uid of the version this one was written on top of, if it is still here. A version is
// an update on a base, so "what did v2 change?" is the diff base → v2 — and comparing it with
// whatever is on disk today answers a different question, one that stops being useful the
// moment the vendor ships a new release.
function _mibParentUid(v) {
    if (!v.parent_sha) return '';
    const p = _mibVersions.find(x => x.sha === v.parent_sha);
    return p ? p.uid : '';
}

// What changed between two versions — or, by default, between one and the file as it is
// now, which is the comparison anybody actually wants ("what did I change since v3?").
// Computed on the server: the version list is deliberately shipped without content, so
