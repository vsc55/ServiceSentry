{#
   Events section: the markup of its tab pane.

   Lives with the rest of the section rather than inline in dashboard.html, which is
   the shell: the panes it used to hold belonged to twelve different sections, so a

#}
<div class="tab-pane fade ss-fullbleed ss-fullbleed-top" id="tab-events">
    <div id="events-container" class="ss-vfill">
        <div class="text-center py-4">
            <div class="spinner-border spinner-border-sm"></div>
        </div>
    </div>
</div>
