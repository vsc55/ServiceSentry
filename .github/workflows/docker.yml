name: Docker

# The image is published from here, so what triggers it IS the release policy:
#
#   main            → :latest, the image a plain `docker pull` gets
#   tag v1.2.3      → :1.2.3 and :1.2, for pinning a version
#   tag test        → :test, the manual escape hatch this workflow started as
#   pull request    → BUILT but never pushed: proof the Dockerfile still builds, and the
#                     one case where a fork could otherwise reach the registry
#   manual dispatch → the same, on demand
#
# Everything gets :sha-<commit> as well, which is the only tag that never moves — the one
# to use when "it worked yesterday" needs to be pinned down.
on:
  push:
    branches: [main]
    tags: ["v*", "test"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushing twice in a minute should not race two publishes onto the same tag: the older run
# is cancelled, so :latest is whatever the newest commit produced and not a coin toss.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: the suite. Nothing is built or published until this passes ──────────────
  tests:
    uses: ./.github/workflows/tests.yml

  # ── Gate 2: installing on a clean machine, the half pytest cannot see ───────────────
  # A sibling of the image build, not a step before it: both only need the suite to be
  # green, and serialising them would add its matrix to every publish for nothing.
  install:
    needs: tests
    uses: ./.github/workflows/install-tests.yml

  # ── Gate 3 (version tags only): the release notes have to EXIST ─────────────────────
  # Runs beside the tests rather than after them so a `v1.2.3` with no CHANGELOG section
  # fails in seconds — while the fix is still "add the heading and re-tag", instead of
  # after an image has already been published under that version.
  changelog:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tagged version has a CHANGELOG section
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME}" > /dev/null

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The semver patterns only apply to real version tags (v1.2.3). Without the
          # enable guard they try to parse the `test` build tag as a version and log
          # "test is not a valid semver" once per pattern.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Named on purpose rather than through type=ref,event=tag: that would also stamp
            # a v-prefixed duplicate of every semver tag. `test` is the only literal one.
            type=raw,value=test,enable=${{ github.ref == 'refs/tags/test' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # amd64 only, deliberately: arm64 has to be emulated through QEMU on a GitHub
          # runner and the pip layer makes that minutes instead of the ~30 s this takes.
          # Adding linux/arm64 here is the whole change if that trade stops being worth it.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Version tags only: publish the GitHub Release ───────────────────────────────────
  # `test` stops one job earlier, on purpose: it is the manual build tag, it moves, and a
  # Release per push of it would be noise pointing at a tag that no longer means that commit.
  release:
    # Everything green, not just the image: a release says "this is fit to install", and the
    # install matrix is the only job that checks that claim.
    needs: [build, install, changelog]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the only job that writes to the repo
    steps:
      - uses: actions/checkout@v5

      - name: Take the notes from the CHANGELOG
        # Already validated by the `changelog` job; re-read here rather than passed between
        # jobs, because a multi-line job output is more plumbing than re-running one script.
        run: |
          .github/scripts/changelog-section.sh "${GITHUB_REF_NAME}" > release-notes.md
          {
            echo
            echo '---'
            echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}\`"
          } >> release-notes.md

      - name: Publish the release
        # gh is preinstalled on the runner: no third-party action in the job that holds the
        # only write permission in this workflow.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
