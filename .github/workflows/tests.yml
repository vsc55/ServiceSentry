name: Tests

# Called by Docker (.github/workflows/docker.yml) as the first job of the pipeline: nothing
# is built or published until this passes. It used to fire on one literal tag named `test`,
# which meant a merge to main ran no tests at all unless someone remembered to move it.
#
# `workflow_call` only — a second set of triggers here would run the whole suite twice for
# the same commit, once on its own and once through the caller. `workflow_dispatch` stays so
# it can still be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.lock

      - name: Install dependencies
        run: |
          # Production: exact, hash-verified versions from the lock (its hashes put pip in
          # --require-hashes mode). Dev tooling goes on top WITHOUT the lock as a -c
          # constraint: a hashed constraints file would force --require-hashes onto the
          # (unhashed) dev requirements and fail. The lock is already installed, so the >=
          # ranges dev pulls in are satisfied and pip does not float production off it.
          pip install -r src/requirements.lock
          pip install -r src/requirements-dev.txt

      - name: Install Playwright browser
        working-directory: src
        # The browser tests (test_ui_playwright.py) skip themselves without a browser binary,
        # so without this step they silently covered nothing on CI. Install Chromium plus the
        # OS libraries it needs on ubuntu-latest (--with-deps runs the apt install). Uses the
        # playwright pinned in requirements-dev.txt, so the browser matches the tested version.
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        working-directory: src
        # -n auto uses the pytest-xdist installed above (otherwise it is dead weight);
        # the suite is ~13 min parallel vs. much longer serial.
        run: pytest -m "not integration" -n auto

  # Windows, for real: cpu, filesystemusage and ram_swap read Windows through PowerShell
  # `Get-CimInstance` (wmic is gone from Windows 11 24H2 and Server 2025), and their parsers
  # were only ever fed recorded output. This runs the exact commands the modules send through
  # the same local device_exec a check uses, plus those modules' own tests, on Windows Server
  # 2025. SSH into a Windows host whose shell is PowerShell is not covered here.
  windows-cim:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.lock

      - name: Install dependencies
        run: |
          pip install -r src/requirements.lock
          pip install -r src/requirements-dev.txt

      - name: Is wmic there? (informative)
        shell: pwsh
        run: |
          if (Get-Command wmic -ErrorAction SilentlyContinue) { "wmic: present" } else { "wmic: absent" }

      - name: Run the CIM commands and the Windows modules' tests
        working-directory: src
        env:
          SS_TEST_WINDOWS_CIM: "1"
        run: >-
          pytest -n0 -rs
          tests/e2e/test_windows_cim_live.py
          watchfuls/cpu watchfuls/filesystemusage watchfuls/ram_swap
