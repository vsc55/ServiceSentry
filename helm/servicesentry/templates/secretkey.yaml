{{- /*
Shared encryption key (.flask_secret), the SAME for every pod so they can all
decrypt the secrets stored in the DB. Precedence: explicit values.secretKey >
an already-deployed key (kept stable across `helm upgrade` via lookup) > a freshly
generated one — and that last one ONLY with generateSecrets=true.

Why the opt-in: `lookup` answers nothing under `helm template`, `--dry-run` and every
GitOps tool that renders that way (Argo CD, Flux's helm-controller in template mode). There,
"generate when none is deployed" meant a NEW key on every render — and a new key makes every
credential and token already stored in the database undecryptable. Failing with a message is
better than that, so the chart fails unless it is told generating is safe (a plain
`helm install`/`helm upgrade`, where lookup sees the live Secret).
*/ -}}
{{- $name := printf "%s-secretkey" (include "servicesentry.fullname" .) -}}
{{- $key := .Values.secretKey -}}
{{- if not $key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (index $existing.data "flask_secret") -}}
{{- $key = index $existing.data "flask_secret" | b64dec -}}
{{- else if .Values.generateSecrets -}}
{{- $key = randAlphaNum 32 | sha256sum -}}
{{- else -}}
{{- fail "secretKey is empty and no deployed key was found. Set secretKey (openssl rand -hex 32) — required with helm template / GitOps, where a generated key would change on every render and make the stored secrets undecryptable — or set generateSecrets=true for a plain helm install." -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "servicesentry.labels" . | nindent 4 }}
  annotations:
    # Keep the generated key on upgrades / helm uninstall keep-history.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  flask_secret: {{ $key | quote }}
