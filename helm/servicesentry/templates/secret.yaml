{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "servicesentry.fullname" . }}-secret
  labels:
    {{- include "servicesentry.labels" . | nindent 4 }}
type: Opaque
stringData:
  SS_USERNAME: {{ .Values.auth.username | quote }}
  SS_PASSWORD: {{ required "auth.password is required (or set existingSecret)" .Values.auth.password | quote }}
  {{- if ne .Values.database.driver "sqlite" }}
  SS_DB_PASSWORD: {{ required "database.password is required (or set existingSecret)" .Values.database.password | quote }}
  {{- end }}
  {{- if and .Values.syslogDatabase.enabled .Values.syslogDatabase.password }}
  SS_SYSLOG_DB_PASSWORD: {{ .Values.syslogDatabase.password | quote }}
  {{- end }}
  {{- if .Values.control.enabled }}
  {{- /* Without a token the services open no control listener, and the probes below pointed
         at a port nobody served: with the default values the worker, events and syslog pods
         were restarted every ~80 s and never became Ready. So, like the secret key, an empty
         token is generated once and kept across upgrades. */}}
  {{- $token := .Values.control.token }}
  {{- if not $token }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "servicesentry.fullname" .)) }}
  {{- if and $existing $existing.data (index $existing.data "SS_CONTROL_TOKEN") }}
  {{- $token = index $existing.data "SS_CONTROL_TOKEN" | b64dec }}
  {{- else if .Values.generateSecrets }}
  {{- /* Only when told it is safe: under helm template / GitOps lookup is always empty,
         and a token generated per render rolled every pod on every sync. */}}
  {{- $token = randAlphaNum 64 }}
  {{- else }}
  {{- fail "control.token is empty and no deployed token was found. Set control.token (openssl rand -hex 32), or control.enabled=false, or generateSecrets=true for a plain helm install (never with helm template / GitOps: it would change on every render)." }}
  {{- end }}
  {{- end }}
  SS_CONTROL_TOKEN: {{ $token | quote }}
  {{- end }}
  {{- with .Values.telegram.token }}
  SS_TELEGRAM_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.telegram.chatId }}
  SS_TELEGRAM_CHAT_ID: {{ . | quote }}
  {{- end }}
{{- end }}
